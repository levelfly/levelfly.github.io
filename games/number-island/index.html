<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ec8e3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%237ec8e3'/%3E%3Cpath d='M16 5l3 7 7 .8-5.2 4.8 1.5 7L16 21l-6.3 3.6 1.5-7L6 12.8l7-.8z' fill='%23ffd23f'/%3E%3C/svg%3E">
<title>數字島大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   數字島大冒險 — 全部樣式
   ============================================================ */
/* ---------- 基礎 reset ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  color:#4a3b31;
  background:#aee3f5;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;touch-action:manipulation;}
img,svg{display:block;}
[hidden]{display:none !important;}
:focus-visible{outline:4px solid #ffb703;outline-offset:3px;border-radius:12px;}

/* ---------- 全域版面 ---------- */
#app{position:fixed;inset:0;overflow:hidden;}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:flex-start;
  overflow:hidden;
}
.screen.active{display:flex;animation:screenIn .35s ease both;}
@keyframes screenIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* ---------- 通用元件 ---------- */
.big-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  min-height:72px;padding:14px 42px;border-radius:999px;
  font-size:clamp(22px,4.5vw,32px);font-weight:800;letter-spacing:.06em;
  color:#fff;background:linear-gradient(180deg,#ffb347,#ff8c42);
  box-shadow:0 6px 0 #d96b1e,0 12px 22px rgba(120,60,0,.25);
  transition:transform .12s ease,box-shadow .12s ease,filter .2s;
}
.big-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #d96b1e,0 4px 8px rgba(120,60,0,.2);}
.big-btn.green{background:linear-gradient(180deg,#8bd450,#5bb32e);box-shadow:0 6px 0 #3f8c1c,0 12px 22px rgba(20,90,0,.25);}
.big-btn.green:active{box-shadow:0 1px 0 #3f8c1c,0 4px 8px rgba(20,90,0,.2);}
.big-btn.blue{background:linear-gradient(180deg,#6ec6ff,#3d9be9);box-shadow:0 6px 0 #2470b8,0 12px 22px rgba(0,70,140,.25);}
.big-btn.blue:active{box-shadow:0 1px 0 #2470b8,0 4px 8px rgba(0,70,140,.2);}
.big-btn.pink{background:linear-gradient(180deg,#ff9ec6,#f2679f);box-shadow:0 6px 0 #c2437a,0 12px 22px rgba(140,0,70,.22);}
.big-btn.pink:active{box-shadow:0 1px 0 #c2437a,0 4px 8px rgba(140,0,70,.2);}
.big-btn:disabled{filter:grayscale(.6) brightness(.92);pointer-events:none;}

.icon-btn{
  width:60px;height:60px;min-width:60px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  background:#fffdf6;box-shadow:0 4px 0 rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.12);
  transition:transform .12s ease,box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 rgba(0,0,0,.12);}
.icon-btn svg{width:32px;height:32px;}
.icon-btn.small{width:48px;height:48px;min-width:48px;}
.icon-btn.small svg{width:26px;height:26px;}

.pill{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.92);border-radius:999px;
  padding:8px 18px;font-weight:800;font-size:20px;
  box-shadow:0 3px 0 rgba(0,0,0,.08);
}

/* ---------- 頂部列(答題畫面) ---------- */
.top-bar{
  width:100%;max-width:980px;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px;
  z-index:5;flex-wrap:nowrap;
}
.top-bar .spacer{flex:1;}
.progress-dots{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.85);padding:8px 14px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.07);}
.pdot{width:16px;height:16px;border-radius:50%;background:#e6ddcf;box-shadow:inset 0 2px 3px rgba(0,0,0,.12);transition:transform .2s,background .2s;}
.pdot.current{background:#ffd23f;transform:scale(1.25);box-shadow:0 0 0 3px rgba(255,210,63,.4);}
.pdot.done{background:#8bd450;}
.star-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:8px 14px;font-weight:800;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.08);}
.star-pill svg{width:26px;height:26px;}
.top-char{width:56px;height:56px;border-radius:50%;background:#fffdf6;box-shadow:0 3px 0 rgba(0,0,0,.1);overflow:hidden;flex:none;}
.top-char svg{width:100%;height:100%;}

/* ---------- 說話泡泡 ---------- */
.speech-row{display:flex;align-items:flex-end;gap:12px;width:100%;max-width:760px;padding:0 16px;z-index:4;}
.speech-char{width:clamp(84px,18vw,130px);flex:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15));}
.speech-bubble{
  position:relative;background:#fffdf6;border-radius:22px;
  padding:14px 20px;font-size:clamp(19px,3.6vw,26px);font-weight:700;line-height:1.35;
  box-shadow:0 4px 0 rgba(0,0,0,.08),0 10px 18px rgba(0,0,0,.1);
  min-height:64px;display:flex;align-items:center;flex:1;
}
.speech-bubble::before{
  content:"";position:absolute;left:-12px;bottom:18px;
  border:8px solid transparent;border-right-color:#fffdf6;border-left:0;
}

/* ---------- 答題主區 ---------- */
.play-stage{
  flex:1;width:100%;max-width:980px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;gap:10px;position:relative;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
}
.question-area{
  flex:1;width:100%;display:flex;align-items:center;justify-content:center;
  position:relative;min-height:0;
}
.answer-area{
  width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:16px;padding:10px 16px 14px;
}
.answer-btn{
  min-width:clamp(96px,20vw,150px);min-height:88px;border-radius:26px;
  background:#fffdf6;font-size:clamp(38px,8vw,58px);font-weight:800;color:#4a3b31;
  box-shadow:0 7px 0 #d9cdb8,0 14px 22px rgba(0,0,0,.14);
  display:flex;align-items:center;justify-content:center;padding:8px 18px;
  transition:transform .12s ease,box-shadow .12s ease,background .2s;
  position:relative;
}
.answer-btn:active{transform:translateY(5px) scale(.97);box-shadow:0 2px 0 #d9cdb8;}
.answer-btn.hint-glow{animation:hintGlow 1s ease-in-out infinite;}
.answer-btn.correct-flash{background:#d8f7c0;box-shadow:0 7px 0 #8bd450,0 0 0 6px rgba(139,212,80,.45);}
@keyframes hintGlow{
  0%,100%{box-shadow:0 7px 0 #d9cdb8,0 0 0 0 rgba(255,183,3,.0);}
  50%{box-shadow:0 7px 0 #d9cdb8,0 0 0 10px rgba(255,183,3,.55);}
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-9px);}40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}80%{transform:translateX(4px);}
}
.shake{animation:wrongShake .45s ease;}
@keyframes optBounce{
  0%{transform:scale(1);}35%{transform:scale(1.14) translateY(-8px);}
  65%{transform:scale(.96);}100%{transform:scale(1);}
}
.opt-bounce{animation:optBounce .5s ease;}

/* 數字字形區分:6/9 加底線,1/7/0 微調 */
.num{display:inline-block;line-height:1;font-family:"Baloo 2","Noto Sans TC",sans-serif;font-weight:800;}
.num.d6{border-bottom:.14em solid #ff8c42;border-radius:.06em;}
.num.d9{border-bottom:.14em solid #3d9be9;border-radius:.06em;}
.num.d0{text-shadow:.04em .04em 0 rgba(0,0,0,.08);}
.num.d1{letter-spacing:0;}
.num.d7{font-style:normal;}

/* ---------- 題目內容卡 ---------- */
.question-card{
  background:rgba(255,255,255,.9);border-radius:32px;padding:22px 26px;
  box-shadow:0 8px 0 rgba(0,0,0,.06),0 18px 30px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;
  max-width:min(92vw,760px);
}
.big-number-show{font-size:clamp(72px,18vw,140px);color:#ff8c42;text-shadow:0 6px 0 rgba(217,107,30,.25);}

/* ---------- 數物品排列 ---------- */
.items-field{position:relative;width:min(92vw,680px);height:100%;max-height:46vh;min-height:220px;}
.count-item{position:absolute;width:var(--sz,72px);height:var(--sz,72px);transform:translate(-50%,-50%);filter:drop-shadow(0 5px 4px rgba(0,0,0,.16));}
.count-item svg{width:100%;height:100%;}
@keyframes itemCountBounce{
  0%{transform:translate(-50%,-50%) scale(1);}
  40%{transform:translate(-50%,-50%) scale(1.35) translateY(-10%);}
  100%{transform:translate(-50%,-50%) scale(1);}
}
.count-item.counting{animation:itemCountBounce .5s ease;}
.count-item.counted::after{
  content:attr(data-n);position:absolute;top:-14px;right:-10px;
  background:#ffb703;color:#fff;font-size:18px;font-weight:800;
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
}

/* ---------- 泡泡模式 ---------- */
.bubble-field{position:relative;width:100%;height:100%;overflow:hidden;}
.bubble{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.45) 42%,rgba(140,210,255,.55) 78%,rgba(90,170,240,.7));
  box-shadow:inset -6px -8px 14px rgba(60,120,200,.25),inset 6px 8px 12px rgba(255,255,255,.8),0 8px 16px rgba(40,100,180,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(30px,6vw,44px);font-weight:800;color:#1f5f9e;
  will-change:transform;touch-action:manipulation;
}
.bubble::after{content:"";position:absolute;top:14%;left:18%;width:22%;height:14%;border-radius:50%;background:rgba(255,255,255,.85);transform:rotate(-24deg);}
.bubble.hint-glow{box-shadow:inset -6px -8px 14px rgba(60,120,200,.25),0 0 0 8px rgba(255,183,3,.65),0 8px 16px rgba(40,100,180,.18);}
@keyframes bubblePop{
  0%{transform:scale(1);opacity:1;}
  60%{transform:scale(1.35);opacity:.9;}
  100%{transform:scale(1.8);opacity:0;}
}
.bubble.popping{animation:bubblePop .35s ease forwards;pointer-events:none;}
@keyframes bubbleAway{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(var(--dx,80px),var(--dy,-40px)) scale(.7);opacity:0;}
}
.bubble.bouncing-away{animation:bubbleAway .5s ease forwards;pointer-events:none;}

/* ---------- 拖曳餵食 ---------- */
.feed-zone{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;height:100%;justify-content:flex-end;position:relative;}
.feed-target{width:clamp(140px,30vw,210px);position:relative;transition:transform .15s;}
.feed-target .mouth-zone{position:absolute;left:50%;top:52%;width:70%;height:56%;transform:translate(-50%,-50%);border-radius:50%;}
.feed-target.hungry-glow{filter:drop-shadow(0 0 14px rgba(255,183,3,.8));}
.feed-tray{
  display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;
  background:rgba(255,255,255,.75);border-radius:26px;padding:14px 18px;min-height:110px;
  box-shadow:0 4px 0 rgba(0,0,0,.06);max-width:94vw;
}
.drag-item{width:clamp(56px,11vw,84px);height:clamp(56px,11vw,84px);touch-action:none;cursor:grab;position:relative;z-index:20;filter:drop-shadow(0 5px 4px rgba(0,0,0,.18));}
.drag-item svg{width:100%;height:100%;pointer-events:none;}
.drag-item.dragging{position:fixed;z-index:999;pointer-events:none;cursor:grabbing;filter:drop-shadow(0 12px 10px rgba(0,0,0,.3));}
.drag-item.returning{transition:left .3s ease,top .3s ease;}
.feed-counter{
  font-size:clamp(24px,5vw,34px);font-weight:800;color:#fff;background:#5bb32e;
  border-radius:999px;padding:6px 22px;box-shadow:0 4px 0 #3f8c1c;
}

/* ---------- 數量配對 ---------- */
.match-wrap{display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,48px);width:100%;height:100%;padding:0 12px;}
.match-items{
  background:rgba(255,255,255,.85);border-radius:28px;padding:16px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  width:min(52vw,420px);min-height:180px;box-shadow:0 6px 0 rgba(0,0,0,.07);
  position:relative;overflow:hidden;
}
.match-items .mi{width:clamp(44px,9vw,68px);height:clamp(44px,9vw,68px);}
.match-items .mi svg{width:100%;height:100%;}
.match-nums{display:flex;flex-direction:column;gap:14px;}
.match-num{
  min-width:92px;min-height:76px;border-radius:22px;background:#fffdf6;
  font-size:clamp(34px,7vw,50px);font-weight:800;
  box-shadow:0 6px 0 #d9cdb8,0 12px 18px rgba(0,0,0,.13);
  display:flex;align-items:center;justify-content:center;touch-action:none;
}
.match-num:active{transform:translateY(4px);box-shadow:0 2px 0 #d9cdb8;}
.match-num.dragging{position:fixed;z-index:999;pointer-events:none;}
.match-num.hint-glow{animation:hintGlow 1s ease-in-out infinite;}
@keyframes fishSwimAway{to{transform:translateX(160%) rotate(8deg);opacity:0;}}
@keyframes balloonFlyUp{to{transform:translateY(-220%) ;opacity:0;}}
@keyframes starFlySky{to{transform:translateY(-200%) scale(.4) rotate(200deg);opacity:0;}}
@keyframes dropBasket{to{transform:translateY(140%) scale(.7);opacity:0;}}
.match-items.done .mi{pointer-events:none;}
.match-items.anim-fish .mi{animation:fishSwimAway .9s ease forwards;}
.match-items.anim-balloon .mi{animation:balloonFlyUp 1s ease forwards;}
.match-items.anim-star .mi{animation:starFlySky 1s ease forwards;}
.match-items.anim-drop .mi{animation:dropBasket .8s ease forwards;}
</style>
<style>
/* ---------- 首頁 HOME ---------- */
#screen-home{background:linear-gradient(180deg,#8fd8f2 0%,#bfeaf7 45%,#fdeecb 100%);}
.home-clouds{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;animation:cloudDrift linear infinite;}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
.cloud::before{width:55%;height:120%;top:-60%;left:12%;}
.cloud::after{width:38%;height:80%;top:-35%;right:12%;}
@keyframes cloudDrift{from{transform:translateX(-30vw);}to{transform:translateX(130vw);}}
.home-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;height:100%;justify-content:center;padding:20px;}
.game-logo{
  font-size:clamp(40px,9vw,76px);font-weight:900;letter-spacing:.04em;color:#fff;
  text-shadow:0 3px 0 #f2679f,0 6px 0 #3d9be9,0 10px 18px rgba(0,60,120,.35);
  display:flex;gap:.08em;flex-wrap:wrap;justify-content:center;
}
.game-logo span{display:inline-block;animation:logoBob 2.6s ease-in-out infinite;}
.game-logo span:nth-child(2){animation-delay:.12s;}.game-logo span:nth-child(3){animation-delay:.24s;}
.game-logo span:nth-child(4){animation-delay:.36s;}.game-logo span:nth-child(5){animation-delay:.48s;}
.game-logo span:nth-child(6){animation-delay:.6s;}.game-logo span:nth-child(7){animation-delay:.72s;}
@keyframes logoBob{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-8px) rotate(-2deg);}}
.home-char{width:clamp(140px,32vw,230px);filter:drop-shadow(0 10px 10px rgba(0,0,0,.18));animation:charFloat 3.4s ease-in-out infinite;}
@keyframes charFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.home-island{position:absolute;left:50%;bottom:-2vh;transform:translateX(-50%);width:min(96vw,820px);
  pointer-events:none;z-index:0;}
.home-island svg{width:100%;height:auto;display:block;}
.home-island .hi-wave{animation:hiWave 5s ease-in-out infinite;}
@keyframes hiWave{0%,100%{transform:translateX(0);}50%{transform:translateX(-22px);}}
.home-side{position:absolute;display:flex;flex-direction:column;gap:12px;}
.home-side.tr{top:calc(14px + env(safe-area-inset-top));right:14px;}
.home-side.bl{bottom:calc(16px + env(safe-area-inset-bottom));left:14px;flex-direction:row;}
.home-sub{font-size:clamp(16px,3vw,22px);font-weight:700;color:#6b5a4e;background:rgba(255,255,255,.75);padding:6px 18px;border-radius:999px;}
.parent-entry{
  position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));right:14px;
  background:rgba(255,255,255,.65);border-radius:999px;padding:8px 16px;
  font-size:16px;font-weight:700;color:#6b5a4e;touch-action:manipulation;
}
.parent-entry.holding{background:#ffe3a3;}

/* ---------- 角色選擇 ---------- */
#screen-character{background:linear-gradient(180deg,#ffe3ec 0%,#fff5e0 100%);}
.screen-title{font-size:clamp(28px,6vw,44px);font-weight:900;color:#4a3b31;margin:calc(18px + env(safe-area-inset-top)) 0 4px;text-shadow:0 3px 0 rgba(255,255,255,.8);}
.screen-sub{font-size:clamp(16px,3vw,20px);color:#8a7663;font-weight:700;margin-bottom:12px;}
.char-cards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;padding:10px 16px;overflow-y:auto;max-height:62vh;width:100%;max-width:900px;}
.char-card{
  width:clamp(120px,26vw,168px);border-radius:28px;background:#fffdf6;
  padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 6px 0 rgba(0,0,0,.08),0 14px 22px rgba(0,0,0,.1);
  transition:transform .15s ease,box-shadow .15s ease;position:relative;
}
.char-card:active{transform:scale(.95);}
.char-card .cc-svg{width:100%;aspect-ratio:1;pointer-events:none;}
.char-card .cc-name{font-size:clamp(18px,3.4vw,24px);font-weight:800;}
.char-card.selected{box-shadow:0 6px 0 #ffb703,0 0 0 6px #ffd23f,0 14px 24px rgba(255,160,0,.3);transform:translateY(-6px) scale(1.03);}
.char-card.selected::after{
  content:"✔";position:absolute;top:-12px;right:-10px;width:40px;height:40px;border-radius:50%;
  background:#8bd450;color:#fff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 #5bb32e;
}
@keyframes cardWiggle{0%,100%{transform:rotate(0);}25%{transform:rotate(-3deg) scale(1.04);}75%{transform:rotate(3deg) scale(1.04);}}
.char-card.wiggle{animation:cardWiggle .4s ease;}
.char-confirm-row{display:flex;gap:14px;padding:14px 0 calc(18px + env(safe-area-inset-bottom));}

/* ---------- 地圖 MAP ---------- */
#screen-map{background:linear-gradient(180deg,#79c9ec 0%,#a8e0f5 40%,#7ec850 40.2%,#5bb32e 100%);}
.map-wrap{position:relative;width:100%;height:100%;max-width:1100px;}
.map-svg{position:absolute;inset:0;width:100%;height:100%;}
.map-top{position:relative;z-index:6;width:100%;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 0;}
.map-area-btn{
  position:absolute;transform:translate(-50%,-50%);z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  width:clamp(88px,17vw,140px);padding:6px;border-radius:24px;
  transition:transform .15s ease,filter .2s;
}
.map-area-btn:active{transform:translate(-50%,-50%) scale(.93);}
.map-area-btn .ma-icon{width:100%;aspect-ratio:1.1;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2));}
.map-area-btn .ma-name{
  background:#fffdf6;border-radius:999px;padding:3px 12px;font-weight:800;
  font-size:clamp(14px,2.6vw,19px);box-shadow:0 3px 0 rgba(0,0,0,.12);white-space:nowrap;
}
.map-area-btn.locked{filter:grayscale(.85) brightness(.8);}
.map-area-btn.locked .ma-name{background:#cfc8bd;color:#7d7468;}
.map-area-btn.current .ma-icon{animation:currentPulse 1.8s ease-in-out infinite;}
@keyframes currentPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.map-area-btn .ma-lock{position:absolute;top:-6px;right:2px;width:34px;height:34px;}
.map-area-btn .ma-done{position:absolute;top:-8px;right:0;width:38px;height:38px;}
.map-area-btn .ma-chest{position:absolute;top:-16px;left:-4px;width:44px;height:44px;animation:chestBob 1.6s ease-in-out infinite;}
@keyframes chestBob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-6px) rotate(4deg);}}
.map-char{position:absolute;z-index:4;width:clamp(64px,12vw,96px);transition:left 1.1s cubic-bezier(.4,1.4,.6,1),top 1.1s cubic-bezier(.4,1.4,.6,1);filter:drop-shadow(0 6px 5px rgba(0,0,0,.2));pointer-events:none;}
.map-bottom{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px;z-index:6;flex-wrap:wrap;padding:0 12px;}
.map-btn{
  display:flex;align-items:center;gap:8px;background:#fffdf6;border-radius:999px;
  padding:10px 20px;font-size:clamp(17px,3vw,22px);font-weight:800;
  box-shadow:0 5px 0 rgba(0,0,0,.14);position:relative;min-height:56px;
}
.map-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
.map-btn svg{width:30px;height:30px;}
.badge-dot{
  position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;border-radius:999px;
  background:#ff5d5d;color:#fff;font-size:15px;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 6px;
  box-shadow:0 2px 4px rgba(0,0,0,.25);animation:badgePulse 1.4s ease-in-out infinite;
}
@keyframes badgePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
/* 地圖裝飾動畫 */
.sway{animation:sway 3.6s ease-in-out infinite;transform-origin:bottom center;}
@keyframes sway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
.twinkle{animation:twinkle 2.2s ease-in-out infinite;transform-origin:center;}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8);}50%{opacity:1;transform:scale(1.1);}}
.waveMove{animation:waveMove 3.2s ease-in-out infinite;}
@keyframes waveMove{0%,100%{transform:translateX(0);}50%{transform:translateX(-14px);}}

/* ---------- 過關 LEVEL_COMPLETE ---------- */
#screen-levelcomplete{background:linear-gradient(180deg,#ffd98e 0%,#fff3d6 60%,#ffe9c4 100%);}
.lc-inner{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;height:100%;justify-content:center;padding:16px;overflow-y:auto;}
.lc-title{font-size:clamp(30px,7vw,52px);font-weight:900;color:#e07b2a;text-shadow:0 3px 0 #fff;}
.lc-char{width:clamp(130px,26vw,200px);}
.lc-stars{display:flex;gap:10px;}
.lc-star{width:clamp(44px,9vw,64px);height:clamp(44px,9vw,64px);opacity:0;transform:scale(0);}
.lc-star.show{animation:starPopIn .5s cubic-bezier(.3,1.6,.5,1) forwards;}
@keyframes starPopIn{0%{opacity:0;transform:scale(0) rotate(-90deg);}100%{opacity:1;transform:scale(1) rotate(0);}}
.lc-info{font-size:clamp(19px,3.8vw,26px);font-weight:800;color:#6b5a4e;background:rgba(255,255,255,.85);border-radius:999px;padding:8px 24px;}
.lc-reward{display:flex;align-items:center;gap:14px;background:#fffdf6;border-radius:26px;padding:12px 22px;box-shadow:0 6px 0 rgba(0,0,0,.08);}
.lc-reward .rw-icon{width:72px;height:72px;}
.lc-reward .rw-name{font-size:clamp(18px,3.6vw,24px);font-weight:800;}
.lc-reward .rw-tag{font-size:15px;font-weight:700;color:#fff;background:#f2679f;border-radius:999px;padding:2px 12px;}
.lc-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
/* 寶箱 */
.chest-box{width:clamp(120px,24vw,180px);position:relative;}
.chest-lid{transform-origin:8% 88%;transition:transform .7s cubic-bezier(.4,1.5,.5,1);}
.chest-box.open .chest-lid{transform:rotate(-105deg);}
.chest-glow{position:absolute;inset:-30%;background:radial-gradient(circle,rgba(255,220,100,.85),transparent 65%);opacity:0;transition:opacity .5s;pointer-events:none;border-radius:50%;}
.chest-box.open .chest-glow{opacity:1;animation:glowPulse 1.2s ease-in-out infinite;}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.15);opacity:1;}}

/* ---------- 收集冊 COLLECTION ---------- */
#screen-collection{background:linear-gradient(180deg,#e7d8ff 0%,#fdf3ff 100%);}
.col-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px 12px;}
.col-tab{
  padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.8);
  font-size:clamp(16px,3.2vw,21px);font-weight:800;color:#8a7663;min-height:52px;
  box-shadow:0 3px 0 rgba(0,0,0,.07);position:relative;
}
.col-tab.active{background:#b28dff;color:#fff;box-shadow:0 3px 0 #8a63d8;}
.sticker-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;
  width:100%;max-width:760px;padding:14px 18px;overflow-y:auto;flex:1;align-content:start;
}
.sticker-cell{
  background:#fffdf6;border-radius:24px;padding:12px 8px;display:flex;flex-direction:column;
  align-items:center;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,.07);min-height:140px;justify-content:center;
}
.sticker-cell .st-icon{width:72px;height:72px;}
.sticker-cell .st-name{font-size:16px;font-weight:800;}
.sticker-cell.silhouette .st-icon{filter:brightness(0) opacity(.18);}
.sticker-cell.silhouette .st-name{color:#b6ab9c;}
.sticker-cell.new-reveal{animation:newReveal .8s cubic-bezier(.3,1.5,.5,1);}
@keyframes newReveal{0%{transform:scale(.4) rotate(-14deg);box-shadow:0 0 0 0 rgba(255,183,3,.9);}60%{transform:scale(1.12) rotate(4deg);}100%{transform:scale(1);box-shadow:0 4px 0 rgba(0,0,0,.07),0 0 0 18px rgba(255,183,3,0);}}

/* ---------- 換裝 DRESS_UP ---------- */
#screen-dressup{background:linear-gradient(180deg,#ffd6e8 0%,#fff0f7 100%);}
.du-wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:18px;width:100%;max-width:900px;padding:8px 16px;flex:1;overflow-y:auto;}
.du-stage{background:rgba(255,255,255,.75);border-radius:32px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.07);}
.du-stage .du-char{width:clamp(160px,34vw,250px);}
.du-panel{display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;}
.du-slot-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.du-slot-label{font-size:clamp(16px,3.2vw,20px);font-weight:800;background:#fffdf6;border-radius:999px;padding:6px 14px;min-width:86px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.07);}
.du-acc{
  width:64px;height:64px;border-radius:18px;background:#fffdf6;
  box-shadow:0 4px 0 rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;padding:6px;
}
.du-acc svg{width:100%;height:100%;pointer-events:none;}
.du-acc.equipped{box-shadow:0 4px 0 #ffb703,0 0 0 4px #ffd23f;}
.du-acc.locked{filter:grayscale(1) brightness(.75);}
.du-acc{position:relative;}
.du-row-btns{display:flex;gap:12px;padding:10px 0 calc(16px + env(safe-area-inset-bottom));}

/* ---------- 小島 ISLAND ---------- */
#screen-island{background:linear-gradient(180deg,#8fd8f2 0%,#cfF0fa 55%,#ffe9b8 100%);}
.island-stage{position:relative;width:min(96vw,720px);flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
.island-stage svg{width:100%;height:auto;max-height:100%;}
.island-list{
  display:flex;gap:10px;overflow-x:auto;width:100%;max-width:820px;padding:8px 14px calc(14px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.island-chip{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:#fffdf6;border-radius:20px;padding:8px 12px;min-width:88px;
  box-shadow:0 4px 0 rgba(0,0,0,.09);font-weight:800;font-size:15px;
}
.island-chip .ic-icon{width:44px;height:44px;}
.island-chip.locked{filter:grayscale(.9) brightness(.82);}
.island-chip .ic-state{font-size:12px;color:#8a7663;}
.island-chip.unlocked .ic-state{color:#5bb32e;}
@keyframes upgradeIn{0%{opacity:0;transform:scale(.3) translateY(30px);}100%{opacity:1;transform:none;}}
.upgrade-anim{animation:upgradeIn .9s cubic-bezier(.3,1.4,.5,1);transform-origin:bottom center;}

/* ---------- 家長中心 PARENT_CENTER ---------- */
#screen-parent{background:#f4efe6;overflow-y:auto;display:none;}
#screen-parent.active{display:flex;}
.parent-panel{width:100%;max-width:680px;padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;}
.parent-card{background:#fffdf6;border-radius:22px;padding:16px 18px;box-shadow:0 4px 0 rgba(0,0,0,.06);}
.parent-card h3{font-size:20px;font-weight:900;margin-bottom:10px;color:#4a3b31;}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-chip{
  padding:10px 18px;border-radius:14px;background:#eee6d8;font-weight:800;font-size:17px;
  min-height:48px;color:#6b5a4e;
}
.opt-chip.on{background:#3d9be9;color:#fff;box-shadow:0 3px 0 #2470b8;}
.opt-chip.green.on{background:#5bb32e;box-shadow:0 3px 0 #3f8c1c;}
.slider-row{display:flex;align-items:center;gap:12px;}
.slider-row input[type=range]{flex:1;accent-color:#3d9be9;height:36px;}
.stats-table{width:100%;border-collapse:collapse;font-size:15px;}
.stats-table th,.stats-table td{padding:6px 8px;text-align:center;border-bottom:1px solid #eee2cf;}
.stats-table th{background:#f7ecd9;font-weight:900;}
.stats-scroll{max-height:280px;overflow-y:auto;border-radius:12px;}
.danger-btn{background:#ff8a8a;color:#fff;font-weight:800;border-radius:14px;padding:12px 20px;font-size:17px;box-shadow:0 4px 0 #d95d5d;min-height:52px;}
.adult-gate{
  position:absolute;inset:0;background:rgba(60,45,30,.55);display:none;
  align-items:center;justify-content:center;z-index:60;backdrop-filter:blur(3px);
}
.adult-gate.show{display:flex;}
.adult-card{background:#fffdf6;border-radius:28px;padding:26px 28px;max-width:88vw;width:400px;display:flex;flex-direction:column;gap:16px;align-items:center;box-shadow:0 20px 40px rgba(0,0,0,.3);}
.adult-card h3{font-size:22px;font-weight:900;}
.adult-q{font-size:34px;font-weight:900;color:#3d9be9;}
.adult-opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.hold-ring{position:absolute;inset:-6px;border-radius:999px;pointer-events:none;}

/* ---------- 覆疊層(寶箱/彩帶/提示) ---------- */
#overlay-root{position:fixed;inset:0;pointer-events:none;z-index:90;}
.chest-overlay{
  position:fixed;inset:0;background:rgba(60,45,30,.5);display:none;
  align-items:center;justify-content:center;z-index:80;flex-direction:column;gap:18px;
}
.chest-overlay.show{display:flex;pointer-events:auto;}
.chest-rewards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.chest-reward-card{
  background:#fffdf6;border-radius:24px;padding:14px 18px;display:flex;flex-direction:column;
  align-items:center;gap:6px;box-shadow:0 8px 0 rgba(0,0,0,.15);opacity:0;transform:translateY(30px) scale(.7);
}
.chest-reward-card.show{animation:rewardCardIn .55s cubic-bezier(.3,1.5,.5,1) forwards;}
.chest-reward-card .cr-icon{width:84px;height:84px;}
.chest-reward-card .cr-name{font-weight:800;font-size:18px;}
.chest-reward-card .cr-type{font-size:13px;font-weight:800;color:#fff;background:#b28dff;border-radius:999px;padding:2px 10px;}
@keyframes rewardCardIn{to{opacity:1;transform:none;}}
#confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden;}
.confetti{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;will-change:transform;animation:confettiFall linear forwards;}
@keyframes confettiFall{
  0%{transform:translateY(-4vh) rotate(0) translateX(0);opacity:1;}
  100%{transform:translateY(108vh) rotate(720deg) translateX(var(--sway,30px));opacity:.85;}
}
.fly-star{position:fixed;z-index:96;width:34px;height:34px;pointer-events:none;will-change:transform;}
#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(80px);
  background:rgba(60,45,30,.92);color:#fff;font-weight:800;font-size:18px;border-radius:999px;
  padding:12px 26px;z-index:99;transition:transform .3s ease;pointer-events:none;max-width:90vw;text-align:center;
}
#toast.show{transform:translateX(-50%) translateY(0);}

/* ---------- 角色 SVG 狀態動畫 ---------- */
.char-svg .eyes{transform-origin:center;}
.char-svg .eye-lid{opacity:0;}
@keyframes blinkAnim{0%,92%,100%{transform:scaleY(1);}95%{transform:scaleY(.08);}}
.char-svg.st-idle .eye-open{animation:blinkAnim 4.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
@keyframes breatheAnim{0%,100%{transform:scale(1,1);}50%{transform:scale(1.02,1.035);}}
.char-svg.st-idle .body-group{animation:breatheAnim 2.8s ease-in-out infinite;transform-origin:bottom center;transform-box:fill-box;}
@keyframes happyHop{0%,100%{transform:translateY(0);}30%{transform:translateY(-12%);}55%{transform:translateY(0);}75%{transform:translateY(-6%);}}
.char-svg.st-happy .all-group{animation:happyHop .9s ease infinite;transform-box:fill-box;}
.char-svg.st-happy .mouth-smile{transform:scaleY(1.35);transform-origin:top center;transform-box:fill-box;}
@keyframes thinkTilt{0%,100%{transform:rotate(0);}50%{transform:rotate(5deg);}}
.char-svg.st-thinking .all-group{animation:thinkTilt 2.2s ease-in-out infinite;transform-origin:bottom center;transform-box:fill-box;}
.char-svg.st-thinking .eye-open{transform:translateY(-2%);transform-box:fill-box;}
@keyframes encourageNod{0%,100%{transform:rotate(0);}25%{transform:rotate(-4deg) translateY(2%);}75%{transform:rotate(4deg) translateY(2%);}}
.char-svg.st-encouraging .all-group{animation:encourageNod 1.1s ease-in-out infinite;transform-origin:bottom center;transform-box:fill-box;}
@keyframes danceAnim{
  0%,100%{transform:rotate(-6deg) translateY(0);}
  25%{transform:rotate(0) translateY(-8%);}
  50%{transform:rotate(6deg) translateY(0);}
  75%{transform:rotate(0) translateY(-8%);}
}
.char-svg.st-dancing .all-group{animation:danceAnim 1s ease-in-out infinite;transform-origin:bottom center;transform-box:fill-box;}
.char-svg.st-dancing .arm-l{animation:armWaveL 1s ease-in-out infinite;transform-origin:bottom right;transform-box:fill-box;}
.char-svg.st-dancing .arm-r{animation:armWaveR 1s ease-in-out infinite;transform-origin:bottom left;transform-box:fill-box;}
@keyframes armWaveL{0%,100%{transform:rotate(0);}50%{transform:rotate(-40deg);}}
@keyframes armWaveR{0%,100%{transform:rotate(0);}50%{transform:rotate(40deg);}}
@keyframes celebrateAnim{
  0%{transform:translateY(0) scale(1);}
  30%{transform:translateY(-14%) scale(1.06);}
  50%{transform:translateY(0) scale(1);}
  70%{transform:translateY(-8%) scale(1.03);}
  100%{transform:translateY(0) scale(1);}
}
.char-svg.st-celebrate .all-group{animation:celebrateAnim .8s ease 2;transform-origin:bottom center;transform-box:fill-box;}
.char-svg.st-celebrate .cheek{fill:#ff9e9e;opacity:.9;}
@keyframes comfortSway{0%,100%{transform:rotate(-2.5deg);}50%{transform:rotate(2.5deg);}}
.char-svg.st-comfort .all-group{animation:comfortSway 1.6s ease-in-out infinite;transform-origin:bottom center;transform-box:fill-box;}
.char-svg.st-comfort .mouth-smile{transform:scaleY(.55);transform-origin:top center;transform-box:fill-box;}
.char-svg .star-sparkle{opacity:0;}
.char-svg.st-celebrate .star-sparkle,.char-svg.st-happy .star-sparkle{opacity:1;animation:twinkle 1s ease-in-out infinite;}

/* ---------- 響應式 ---------- */
@media (max-width:520px){
  .top-bar{gap:6px;padding-left:8px;padding-right:8px;}
  .star-pill{font-size:17px;padding:6px 10px;}
  .progress-dots{padding:6px 10px;gap:6px;}
  .pdot{width:13px;height:13px;}
  .icon-btn{width:52px;height:52px;min-width:52px;}
  .icon-btn svg{width:28px;height:28px;}
  .match-wrap{gap:10px;}
  .answer-area{gap:12px;}
}
@media (min-width:900px) and (orientation:landscape){
  .speech-row{max-width:860px;}
  .play-stage{max-width:1100px;}
}
@media (max-height:500px) and (orientation:landscape){
  .speech-char{width:70px;}
  .speech-bubble{min-height:48px;padding:8px 16px;font-size:17px;}
  .answer-btn{min-height:72px;font-size:34px;}
  .top-bar{padding-top:6px;}
}

/* ---------- 減少動態效果 ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  .cloud,.map-char{animation:none !important;}
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 首頁 ============ -->
  <section id="screen-home" class="screen" aria-label="首頁">
    <div class="home-clouds" id="home-clouds" aria-hidden="true"></div>
    <div class="home-island" aria-hidden="true"><svg viewBox="0 0 820 240">
      <ellipse class="hi-wave" cx="410" cy="205" rx="430" ry="52" fill="#6ec3ea" opacity=".85"/>
      <ellipse cx="410" cy="215" rx="470" ry="52" fill="#4fa9d8" opacity=".6"/>
      <ellipse cx="410" cy="178" rx="300" ry="52" fill="#f2dfa8"/>
      <ellipse cx="410" cy="165" rx="252" ry="44" fill="#8bd450"/>
      <ellipse cx="410" cy="172" rx="252" ry="36" fill="#79c43e" opacity=".55"/>
      <g transform="translate(255 88)"><rect x="-8" y="38" width="16" height="34" rx="7" fill="#8a5a33"/>
        <circle cx="0" cy="22" r="34" fill="#5bb32e"/><circle cx="-24" cy="34" r="22" fill="#6ec23e"/>
        <circle cx="24" cy="34" r="22" fill="#6ec23e"/><circle cx="-10" cy="14" r="5" fill="#e84e4e"/>
        <circle cx="14" cy="26" r="5" fill="#e84e4e"/></g>
      <g transform="translate(545 96)"><rect x="-7" y="34" width="14" height="30" rx="6" fill="#8a5a33"/>
        <circle cx="0" cy="18" r="28" fill="#6ec23e"/><circle cx="-20" cy="30" r="18" fill="#7ecf4e"/>
        <circle cx="20" cy="30" r="18" fill="#7ecf4e"/></g>
      <g transform="translate(410 120)"><path d="M-26 44 Q-26 6 0 6 Q26 6 26 44 Z" fill="#f2679f"/>
        <rect x="-30" y="40" width="60" height="12" rx="6" fill="#d8548c"/>
        <rect x="-7" y="18" width="14" height="20" rx="6" fill="#fff" opacity=".85"/></g>
    </svg></div>
    <div class="home-inner">
      <h1 class="game-logo" id="game-logo" aria-label="數字島大冒險"></h1>
      <div class="home-char" id="home-char" aria-hidden="true"></div>
      <div class="home-sub" id="home-sub">和動物朋友一起找回數字星星！</div>
      <button class="big-btn green" id="btn-start" style="font-size:clamp(26px,5.5vw,38px);">▶ 開始冒險</button>
    </div>
    <div class="home-side tr">
      <button class="icon-btn" id="btn-sound-home" aria-label="聲音開關"></button>
    </div>
    <button class="parent-entry" id="btn-parent-entry" aria-label="家長中心（長按三秒進入）">家長中心（長按）</button>
  </section>

  <!-- ============ 角色選擇 ============ -->
  <section id="screen-character" class="screen" aria-label="選擇角色">
    <h2 class="screen-title">選擇你的好伙伴</h2>
    <div class="screen-sub">點一下喜歡的動物朋友吧！</div>
    <div class="char-cards" id="char-cards"></div>
    <div class="char-confirm-row">
      <button class="big-btn blue" id="btn-char-back">← 回去</button>
      <button class="big-btn green" id="btn-char-ok" disabled>出發囉！</button>
    </div>
  </section>

  <!-- ============ 小島地圖 ============ -->
  <section id="screen-map" class="screen" aria-label="小島地圖">
    <div class="map-wrap" id="map-wrap">
      <svg class="map-svg" id="map-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <div class="map-top">
        <button class="icon-btn" id="btn-map-home" aria-label="回首頁"></button>
        <div class="spacer" style="flex:1;"></div>
        <div class="star-pill" id="map-star-pill"></div>
        <div class="top-char" id="map-char-head" aria-hidden="true"></div>
      </div>
      <div class="map-char" id="map-char"></div>

}

  Object.keys(target).forEach(k => {
    if (!(k in out) && k !== 'saveDataVersion') out[k] = target[k];
  });
  return out;
}
function cloneJSON(o){ return JSON.parse(JSON.stringify(o)); }

/* ============ SPEECH ============ */
/* 單一 speak(text) 介面,日後可整支換成預錄 MP3 播放 */
const Speech = {
  supported: ('speechSynthesis' in window),
  voices: [],
  speaking: false,
  init(){
    if (!this.supported) return;
    const load = () => { this.voices = window.speechSynthesis.getVoices() || []; };
    load();
    if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined'){
      window.speechSynthesis.onvoiceschanged = load;
    }
  },
  pickVoice(){
    if (!this.supported) return null;
    const mode = Save.data.settings.languageMode;
    const vs = this.voices.length ? this.voices : (window.speechSynthesis.getVoices() || []);
    if (mode === 'en'){
      return vs.find(v => /^en(-|_)/i.test(v.lang)) || vs.find(v => /en/i.test(v.lang)) || null;
    }
    return vs.find(v => /zh(-|_)TW/i.test(v.lang)) ||
           vs.find(v => /zh(-|_)HK/i.test(v.lang)) ||
           vs.find(v => /^zh/i.test(v.lang)) || null;
  },
  /* 暖機:iOS/Chrome 需在第一次手勢中呼叫一次 */
  warmUp(){
    if (!this.supported) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.rate = 2;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  },
  cancel(){
    if (!this.supported) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    this.speaking = false;
    BGM.unduck();
  },
  speak(text, opts){
    opts = opts || {};
    if (!this.supported || !text){ if (opts.onend) opts.onend(); return; }
    try {
      window.speechSynthesis.cancel();   // 絕不疊音
      const mode = Save.data.settings.languageMode;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = mode === 'en' ? 'en-US' : 'zh-TW';
      const v = this.pickVoice();
      if (v) u.voice = v;
      u.rate = clamp(Number(Save.data.settings.voiceRate) || 0.9, 0.5, 1.3);
      u.pitch = 1.15;
      this.speaking = true;
      BGM.duck();
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        this.speaking = false;
        BGM.unduck();
        if (opts.onend) opts.onend();
      };
      u.onend = done;
      u.onerror = done;
      window.speechSynthesis.speak(u);
      /* 某些瀏覽器長句會卡住,保險計時 */
      const guard = setTimeout(() => {
        if (this.speaking && !window.speechSynthesis.speaking){ clearTimeout(guard); done(); }
      }, Math.max(4000, text.length * 320));
    } catch (e) {
      this.speaking = false;
      if (opts.onend) opts.onend();
    }
  }
};

/* ============ SFX / BGM (WebAudio 程序生成,無音檔) ============ */
const AudioSys = {
  ctx: null, master: null, sfxGain: null, bgmGain: null,
  ensure(){
    if (this.ctx){ if (this.ctx.state === 'suspended'){ this.ctx.resume().catch(()=>{}); } return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = Save.data.settings.soundEnabled ? 1 : 0;
      this.sfxGain.connect(this.master);
      this.bgmGain = this.ctx.createGain();
      this.bgmGain.gain.value = Save.data.settings.musicEnabled ? 0.5 : 0;
      this.bgmGain.connect(this.master);
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
      return true;
    } catch (e) { return false; }
  },
  applyToggles(){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.sfxGain.gain.setTargetAtTime(Save.data.settings.soundEnabled ? 1 : 0, t, 0.05);
    this.bgmGain.gain.setTargetAtTime(Save.data.settings.musicEnabled ? BGM.volume : 0, t, 0.05);
  },
  tone(freq, start, dur, type, vol, dest, slideTo){
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + start;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
};
const SFX = {
  ok(){ return AudioSys.ctx && Save.data.settings.soundEnabled; },
  click(){ if (this.ok()) AudioSys.tone(660, 0, 0.09, 'triangle', 0.18); },

};
const BGM = {
  playing: false, timer: null, step: 0, volume: 0.42, ducked: false,
  /* 兒歌風loop:C 大調五聲音階 */
  melody: [
    523.25, 587.33, 659.25, 783.99, 659.25, 783.99, 880, 783.99,
    659.25, 587.33, 523.25, 587.33, 659.25, 523.25, 0, 0
  ],
  bass: [261.63, 0, 329.63, 0, 392, 0, 329.63, 0],
  start(){
    if (this.playing || !AudioSys.ctx) return;
    if (!Save.data.settings.musicEnabled) return;
    this.playing = true;
    this.step = 0;
    const tick = () => {
      if (!this.playing) return;
      const i = this.step % this.melody.length;
      const m = this.melody[i];
      if (m) AudioSys.tone(m, 0, 0.32, 'triangle', 0.12, AudioSys.bgmGain);
      const b = this.bass[this.step % this.bass.length];
      if (b) AudioSys.tone(b, 0, 0.5, 'sine', 0.07, AudioSys.bgmGain);
      this.step++;
      this.timer = setTimeout(tick, 300);
    };

  },
  stop(){ this.playing = false; clearTimeout(this.timer); },
  duck(){
    if (!AudioSys.ctx || this.ducked) return;
    this.ducked = true;
    AudioSys.bgmGain.gain.setTargetAtTime(Save.data.settings.musicEnabled ? this.volume * 0.25 : 0, AudioSys.ctx.currentTime, 0.08);
  },
  unduck(){
    if (!AudioSys.ctx || !this.ducked) return;
    this.ducked = false;
    AudioSys.bgmGain.gain.setTargetAtTime(Save.data.settings.musicEnabled ? this.volume : 0, AudioSys.ctx.currentTime, 0.15);
  }
};

<script>
'use strict';
/* ============ PARENT STATS: 逐數字統計 ============ */
function numStat(n){
  const st = Save.data.numberStats;
  const k = String(n);
  if (!st[k] || typeof st[k] !== 'object'){
    st[k] = { appear: 0, correct: 0, wrong: 0, firstTry: 0, totalMs: 0, last5: [] };
  }
  const s = st[k];
  if (!Array.isArray(s.last5)) s.last5 = [];
  ['appear','correct','wrong','firstTry','totalMs'].forEach(f => { if (typeof s[f] !== 'number') s[f] = 0; });
  return s;
}
function recordNumberAttempt(n, correct, firstTry, ms){
  const s = numStat(n);
  s.appear++;
  if (correct){ s.correct++; if (firstTry) s.firstTry++; } else s.wrong++;
  s.totalMs += ms;
  s.last5.push(correct ? 1 : 0);
  if (s.last5.length > 5) s.last5.shift();
  Save.data.totalAnswers++;
  Save.save();
}

/* ============ DIFFICULTY: 適性難度(對孩子完全隱形) ============ */
const Difficulty = {
  overallAccuracy(){
    const st = Save.data.numberStats;
    let c = 0, w = 0;
    Object.keys(st).forEach(k => { c += st[k].correct || 0; w += st[k].wrong || 0; });
    if (c + w < 8) return 0.5;   // 資料不足:中等
    return c / (c + w);
  },
  weakness(n){
    const s = numStat(n);
    if (s.appear === 0) return 0.4;
    const wrongRate = s.wrong / Math.max(1, s.appear);
    const recentBad = s.last5.length >= 3 ? (1 - s.last5.reduce((a, b) => a + b, 0) / s.last5.length) : 0;
    return clamp(wrongRate * 0.6 + recentBad * 0.4, 0, 1);
  },
  /* 選題數字:弱項加權重複,但保持隨機感 */
  pickNumber(){
    const r = Save.data.settings.numberRange;
    const pool = [];
    for (let n = r.min; n <= r.max; n++) pool.push(n);
    const weighted = [];
    pool.forEach(n => {
      const w = 1 + Math.round(this.weakness(n) * 3);   // 弱的出現率最高 4 倍
      for (let i = 0; i < w; i++) weighted.push(n);
    });
    return choice(weighted);
  },
  optionCount(){
    const acc = this.overallAccuracy();
    const answers = Save.data.totalAnswers;
    if (answers < 15) return 2;
    if (acc >= 0.82 && answers > 60) return choice([3, 4]);
    if (acc >= 0.65) return 3;
    return 2;
  },
  /* 做得好→選項更接近;掙扎→選項拉開 */
  distractors(n, count){
    const r = Save.data.settings.numberRange;
    const acc = this.overallAccuracy();
    const close = acc >= 0.7;
    const out = new Set();
    let guard = 0;
    while (out.size < count && guard++ < 60){
      let d;
      if (close) d = n + choice([-2, -1, 1, 2]);
      else d = n + choice([-5, -4, -3, 3, 4, 5, -2, 2]);
      if (d >= r.min && d <= r.max && d !== n) out.add(d);
    }
    /* 範圍太小時直接循序填 */
    let f = r.min;
    while (out.size < count && f <= r.max){ if (f !== n) out.add(f); f++; }
    return Array.from(out);
  },
  hintDelay(){
    const acc = this.overallAccuracy();
    return acc < 0.5 ? 1 : 2;   // 較弱的孩子第 1 次錯就給提示
  }
};

/* ============ QUESTION GENERATOR ============ */
const MODE_WEIGHTS = [
  ['listen', 30], ['count', 30], ['feed', 15], ['bubble', 10], ['match', 15]
];
function pickMode(lastTwo){
  const allowed = MODE_WEIGHTS.filter(m => !(lastTwo[0] === m[0] && lastTwo[1] === m[0]));
  const total = allowed.reduce((a, m) => a + m[1], 0);
  let roll = Math.random() * total;
  for (const m of allowed){ roll -= m[1]; if (roll <= 0) return m[0]; }
  return allowed[0][0];
}
function buildLevelQuestions(areaId){
  const area = areas.find(a => a.id === areaId) || areas[0];
  const count = Save.data.settings.questionsPerLevel;
  const qs = [];
  const lastTwo = [];
  for (let i = 0; i < count; i++){
    const mode = pickMode(lastTwo);
    lastTwo.unshift(mode); lastTwo.length = Math.min(lastTwo.length, 2);
    const r = Save.data.settings.numberRange;
    const lo = (mode === 'feed' || mode === 'count') ? Math.max(r.min, 1) : r.min;
    const hi = mode === 'feed' ? Math.min(r.max, 8) : (mode === 'count' ? Math.min(r.max, 12) : r.max);
    const roll = () => clamp(Difficulty.pickNumber(), lo, hi);
    let num = roll();
    /* 不連續出同一個數字(範圍小到挪不開才放行) */
    const prev = qs.length ? qs[qs.length - 1].num : null;
    let retry = 0;
    while (prev !== null && num === prev && retry++ < 12) num = roll();
    if (prev !== null && num === prev){
      const alt = [num - 1, num + 1, num - 2, num + 2].find(v => v >= lo && v <= hi);
      if (alt !== undefined) num = alt;
    }
    const item = itemById(choice(area.items));
    const optCount = Difficulty.optionCount();
    const options = shuffle([num].concat(Difficulty.distractors(num, optCount - 1)));
    /* 區域專屬句式優先,沒有才用通用句式 */
    const areaSet = (typeof AREA_PHRASES !== 'undefined' && AREA_PHRASES[areaId] && AREA_PHRASES[areaId][mode]) || null;
    const phrase = areaSet && Math.random() < 0.7 ? choice(areaSet) : choice(MODE_PHRASES[mode]);
    qs.push({
      mode: mode, num: num, item: item, options: options, phrase: phrase,
      layout: choice(['row', 'grid', 'circle', 'scattered']),
      areaId: areaId
    });
  }
  return qs;
}

/* ============ RENDER: PLAYING 總控 ============ */
function startLevel(areaId){
  App.areaId = areaId;
  App.questions = buildLevelQuestions(areaId);

function questionSpeechText(q){
  const c = charById(currentCharId());
  const enItem = (q.mode === 'count' || q.mode === 'match') ? q.item.nameEn + 's'
    : (q.num > 1 ? q.item.nameEn + 's' : q.item.nameEn);
  const mapZh = { NUM: numToZh(q.num), ITEM: q.item.nameZh, UNIT: q.item.unitZh, CHAR: c.nameZh };
  const mapEn = { NUM: numToEn(q.num), ITEM: enItem, UNIT: '', CHAR: c.nameEn };
  const mode = Save.data.settings.languageMode;
  if (mode === 'en') return fillPhrase(q.phrase.en, mapEn);
  if (mode === 'both') return fillPhrase(q.phrase.zh, mapZh) + '. ' + fillPhrase(q.phrase.en, mapEn);
  return fillPhrase(q.phrase.zh, mapZh);

function renderQuestion(){

/* ---- 答對 / 答錯核心 ---- */
function onCorrect(sourceEl){
  if (App.inputLocked) return;
  App.inputLocked = true;
  const q = App.currentQ;
  const ms = Date.now() - App.qStartTime;
  recordNumberAttempt(q.num, true, App.firstTry, ms);
  App.starsThisLevel++;
  App.correctThisLevel++;
  Save.data.progress.stars++;
  /* 連續一次答對 3 題:額外獎勵星(不懲罰中斷,純加分) */
  if (App.firstTry) App.streak = (App.streak || 0) + 1; else App.streak = 0;
  const streakBonus = App.streak > 0 && App.streak % 3 === 0;
  if (streakBonus){
    Save.data.progress.stars++;
    App.starsThisLevel++;
  }
  Save.save();
  SFX.correct();
  spawnConfetti(streakBonus ? 26 : 14);
  $('#play-char').innerHTML = characterSVG(currentCharId(), streakBonus ? 'dancing' : 'celebrate', equipped());
  flyStarToBar(sourceEl);
  const restate = streakBonus && typeof STREAK_PHRASES !== 'undefined' ? choice(STREAK_PHRASES) : choice(RESTATE_PHRASES);
  const mode = Save.data.settings.languageMode;
  const say = fillPhrase(mode === 'en' ? restate.en : restate.zh, { NUM: numWord(q.num) }) +
    (mode === 'both' ? ' ' + fillPhrase(restate.en, { NUM: numToEn(q.num) }) : '');
  $('#speech-bubble').textContent = say;
  /* 覆述答案 → 角色專屬鼓勵台詞 → 下一題 */
  let advanced = false;
  const advance = () => { if (advanced) return; advanced = true; nextQuestion(); };
  Speech.speak(say, { onend: () => {
    if (App.screen !== 'playing' || !App.inputLocked){ advance(); return; }
    const cs = speakPhrase(choice(charById(currentCharId()).cheer));
    $('#speech-bubble').textContent = cs;
    Speech.speak(cs, { onend: advance });
  }});
  setTimeout(advance, REDUCED_MOTION ? 900 : 4200);
}
function onWrong(el){
  if (App.inputLocked) return;
  const q = App.currentQ;

/* ============ MODE 1: 聽聲音找數字 ============ */
function renderListen(q){

/* ============ MODE 2: 看數量找數字 ============ */
function layoutPositions(n, pattern){
  const pos = [];
  if (pattern === 'row'){
    for (let i = 0; i < n; i++){
      const x = n === 1 ? 50 : 12 + (76 * i) / (n - 1);
      pos.push({ x: x, y: 50 });
    }
  } else if (pattern === 'grid'){
    const cols = Math.ceil(Math.sqrt(n));
    const rows = Math.ceil(n / cols);
    for (let i = 0; i < n; i++){
      const c = i % cols, r = Math.floor(i / cols);
      const x = cols === 1 ? 50 : 18 + (64 * c) / (cols - 1);
      const y = rows === 1 ? 50 : 22 + (56 * r) / (rows - 1);
      pos.push({ x: x, y: y });
    }
  } else if (pattern === 'circle'){
    const R = n <= 4 ? 26 : 33;
    for (let i = 0; i < n; i++){
      const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
      pos.push({ x: 50 + R * Math.cos(ang), y: 50 + (R * 0.82) * Math.sin(ang) });
    }
  } else {
    /* scattered: 最小距離拒絕取樣,保證不重疊 */
    const minD = n <= 5 ? 24 : n <= 8 ? 19 : 15;
    let guard = 0;
    while (pos.length < n && guard++ < 900){
      const x = randInt(12, 88), y = randInt(16, 84);
      let ok = true;
      for (const p of pos){
        if (Math.hypot(p.x - x, (p.y - y) * 1.2) < minD){ ok = false; break; }
      }
      if (ok) pos.push({ x: x, y: y });
    }
    /* 保底:退化成 grid */
    while (pos.length < n){ pos.push({ x: 14 + (pos.length % 5) * 18, y: 30 + Math.floor(pos.length / 5) * 26 }); }
  }
  return pos;
}
function renderCount(q){
  const area = $('#question-area');
  area.innerHTML = '';
  const field = document.createElement('div');
  field.className = 'items-field';
  const n = q.num;
  const sz = n <= 5 ? 84 : n <= 8 ? 70 : n <= 12 ? 58 : 48;
  const positions = layoutPositions(n, q.layout);
  positions.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'count-item';
    d.style.setProperty('--sz', sz + 'px');
    d.style.left = p.x + '%';
    d.style.top = p.y + '%';
    d.style.zIndex = i;
    d.innerHTML = itemSVG(q.item.id);
    field.appendChild(d);
  });
  area.appendChild(field);
  renderNumberOptions(q, (pick, b) => {
    if (App.inputLocked) return;
    if (pick === q.num){
      b.classList.add('correct-flash');
      countOutLoud(q, field, () => onCorrect(b));
    } else {
      onWrong(b);

  });

/* 答對後逐一數數:物品依序彈跳 + 唸出聲 */
function countOutLoud(q, field, done){
  App.inputLocked = true;
  const items = $$('.count-item', field);
  const zhCount = [];
  for (let i = 1; i <= q.num; i++) zhCount.push(numToZh(i));
  const unit = Save.data.settings.languageMode === 'en' ? '' : q.item.unitZh;
  let say;
  if (Save.data.settings.languageMode === 'en'){

  } else if (Save.data.settings.languageMode === 'both'){

<script>
'use strict';
/* ============ DRAG: Pointer Events 拖曳(滑鼠+觸控通用) ============ */
/* opts: onDrop(el) 命中目標時呼叫;isOver(x,y) 自訂命中判定;onPickup() */
function makeDraggable(el, opts){
  opts = opts || {};
  el.style.touchAction = 'none';
  let drag = null;
  el.addEventListener('pointerdown', e => {
    if (App.inputLocked && !opts.workWhileLocked) return;
    unlockAudio();
    e.preventDefault();
    const r = el.getBoundingClientRect();
    drag = {
      id: e.pointerId,
      homeRect: r,
      dx: e.clientX - (r.left + r.width / 2),
      dy: e.clientY - (r.top + r.height / 2),
      moved: false
    };
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    if (opts.onPickup) opts.onPickup(el);
  });
  el.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const x = e.clientX - drag.dx, y = e.clientY - drag.dy;
    if (!drag.moved){
      if (Math.hypot(e.movementX || 0, e.movementY || 0) < 1 &&
          Math.hypot(x - (drag.homeRect.left + drag.homeRect.width / 2), y - (drag.homeRect.top + drag.homeRect.height / 2)) < 8) return;
      drag.moved = true;
      el.classList.add('dragging');
      el.style.width = drag.homeRect.width + 'px';
      el.style.height = drag.homeRect.height + 'px';
      el.style.margin = '0';
    }
    el.style.left = (x - drag.homeRect.width / 2) + 'px';
    el.style.top = (y - drag.homeRect.height / 2) + 'px';
    if (opts.onMove) opts.onMove(e.clientX, e.clientY, el);
  });
  const finish = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
    if (!d.moved){
      el.classList.remove('dragging');
      el.style.left = ''; el.style.top = ''; el.style.width = ''; el.style.height = ''; el.style.margin = '';
      if (opts.onTap) opts.onTap(el);
      return;
    }
    const over = opts.isOver ? opts.isOver(e.clientX, e.clientY, el) : false;
    if (over){
      el.classList.remove('dragging');
      opts.onDrop(el, e.clientX, e.clientY);
    } else {
      /* 回彈原位 */
      el.classList.add('returning');
      el.style.left = d.homeRect.left + 'px';
      el.style.top = d.homeRect.top + 'px';
      SFX.boing();
      setTimeout(() => {
        el.classList.remove('dragging', 'returning');
        el.style.left = ''; el.style.top = ''; el.style.width = ''; el.style.height = ''; el.style.margin = '';
      }, 320);
    }
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
}

/* ============ MODE 3: 拖曳餵食 ============ */
function renderFeed(q){
  const area = $('#question-area');
  const answers = $('#answer-area');
  answers.innerHTML = '';
  area.innerHTML = '';
  const zone = document.createElement('div');
  zone.className = 'feed-zone';
  /* 餵食目標:目前角色張嘴等吃 */
  const target = document.createElement('div');
  target.className = 'feed-target hungry-glow';
  target.id = 'feed-target';
  target.innerHTML = characterSVG(currentCharId(), 'happy', equipped());
  /* 計數 */
  const counter = document.createElement('div');
  counter.className = 'feed-counter';
  counter.id = 'feed-counter';
  counter.textContent = '0 / ' + q.num;
  /* 托盤:正解數量 + 2 個干擾 */
  const tray = document.createElement('div');
  tray.className = 'feed-tray';
  const totalItems = Math.min(q.num + 2, 10);
  for (let i = 0; i < totalItems; i++){
    const it = document.createElement('div');
    it.className = 'drag-item';
    it.setAttribute('role', 'button');
    it.setAttribute('aria-label', itemName(q.item));
    it.innerHTML = itemSVG(q.item.id);
    tray.appendChild(it);
    makeDraggable(it, {
      workWhileLocked: true,
      isOver: (x, y) => {
        const r = target.getBoundingClientRect();
        return x > r.left - 20 && x < r.right + 20 && y > r.top - 20 && y < r.bottom + 20;
      },
      onDrop: (el) => feedDrop(el, q, target, counter, zone)
    });
  }
  const mid = document.createElement('div');
  mid.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;justify-content:center;width:100%;';
  mid.appendChild(target);
  mid.appendChild(counter);
  zone.appendChild(mid);
  zone.appendChild(tray);
  area.appendChild(zone);
}
function feedDrop(el, q, target, counter, zone){
  if (App.feedPhase !== 1 || App.inputLocked) return;
  App.feedDropped++;
  const n = App.feedDropped;
  SFX.drop();
  /* 食物飛進角色嘴裡的動畫 */
  const r = target.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  const fly = document.createElement('div');
  fly.style.cssText = 'position:fixed;z-index:98;width:' + er.width + 'px;height:' + er.height + 'px;left:' + er.left + 'px;top:' + er.top + 'px;pointer-events:none;';
  fly.innerHTML = itemSVG(q.item.id);
  document.body.appendChild(fly);
  el.remove();
  const dx = r.left + r.width / 2 - (er.left + er.width / 2);
  const dy = r.top + r.height * 0.55 - (er.top + er.height / 2);
  const anim = fly.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.25)', opacity: .9 }
  ], { duration: REDUCED_MOTION ? 120 : 420, easing: 'ease-in' });
  anim.onfinish = () => fly.remove();
  counter.textContent = n + ' / ' + q.num;
  /* 每餵一個就數出聲 */
  Speech.speak(numWord(n) + '!');
  setCharState(target, 'happy');
  if (n >= q.num){
    App.feedPhase = 2;
    App.inputLocked = false;
    target.classList.remove('hungry-glow');
    SFX.correct();
    target.innerHTML = characterSVG(currentCharId(), 'celebrate', equipped());
    /* 第二階段:問對應數字 */
    setTimeout(() => {
      const unit = Save.data.settings.languageMode === 'en' ? '' : q.item.unitZh;
      let say;
      if (Save.data.settings.languageMode === 'en'){
        say = 'Yummy! I ate ' + numToEn(q.num) + ' ' + q.item.nameEn + (q.num > 1 ? 's' : '') + '! Which number is it?';
      } else if (Save.data.settings.languageMode === 'both'){
        say = '吃飽了!我吃了 ' + numToZh(q.num) + ' ' + unit + q.item.nameZh + '! I ate ' + numToEn(q.num) + '! 是數字幾呢?';
      } else {
        say = '吃飽了!我吃了 ' + numToZh(q.num) + ' ' + unit + q.item.nameZh + '!是數字幾呢?';
      }
      $('#speech-bubble').textContent = say;
      Speech.speak(say);
      zone.querySelector('.feed-tray').style.display = 'none';
      q.phraseOriginal = q.phrase;   // 保留原句供重播切換
      q.phrase = { zh: '吃飽了!是數字幾呢?', en: 'Yummy! Which number is it?' };
      renderNumberOptions(q, (pick, b) => pickNumberAnswer(q, pick, b));
    }, REDUCED_MOTION ? 500 : 1400);
  }
}

/* ============ MODE 4: 數字泡泡 ============ */
function renderBubble(q){
  const area = $('#question-area');
  $('#answer-area').innerHTML = '';
  area.innerHTML = '';
  const field = document.createElement('div');
  field.className = 'bubble-field';
  area.appendChild(field);
  const rect = () => field.getBoundingClientRect();
  const nums = shuffle(q.options.slice());
  App.bubbles = [];
  const lanes = nums.length;
  nums.forEach((n, i) => {
    const b = document.createElement('button');
    b.className = 'bubble';
    b.dataset.num = n;
    b.setAttribute('aria-label', txt('泡泡 數字 ' + numToZh(n), 'bubble number ' + numToEn(n)));
    b.innerHTML = numHTML(n);
    field.appendChild(b);
    const size = clamp(Math.round(window.innerWidth * 0.17), 84, 128);
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    /* 各自航道,避免完全遮蔽 */
    const laneW = 100 / lanes;
    const state = {
      el: b, size: size,
      x: (i + 0.5) * laneW + randInt(-4, 4),
      y: randInt(15, 80),
      vx: (Math.random() < 0.5 ? -1 : 1) * (0.9 + Math.random() * 0.8),   // %/s 幼兒慢速
      vy: (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 0.6),
      phase: Math.random() * Math.PI * 2,
      dead: false
    };
    App.bubbles.push(state);
    b.addEventListener('pointerdown', () => {
      unlockAudio();
      if (App.inputLocked || state.dead) return;
      if (n === q.num){
        state.dead = true;
        b.classList.add('popping');
        SFX.pop();
        onCorrect(b);
      } else {
        state.dead = true;
        b.style.setProperty('--dx', (state.vx > 0 ? 90 : -90) + 'px');
        b.style.setProperty('--dy', '-50px');
        b.classList.add('bouncing-away');
        onWrong(b);
        /* 錯的泡泡飛走後,從邊緣重生(不設失敗) */
        setTimeout(() => {
          b.classList.remove('bouncing-away');
          state.dead = false;
          state.x = state.vx > 0 ? 6 : 94;
          state.y = randInt(20, 75);
        }, 560);
      }
    });
  });
  if (REDUCED_MOTION){
    /* 減少動態:泡泡固定排列,不飄移 */
    App.bubbles.forEach((st, i) => {
      st.el.style.transform = 'translate(' + ((100 / App.bubbles.length) * (i + 0.5) / 100 * rect().width - st.size / 2) + 'px,' + (rect().height * 0.4) + 'px)';
    });
    return;
  }
  let last = performance.now();
  const step = (now) => {
    if (App.screen !== 'playing' || !field.isConnected){ App.bubbleRAF = null; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const r = rect();
    if (r.width > 0){
      App.bubbles.forEach(st => {
        if (st.dead) return;
        st.phase += dt;
        st.x += st.vx * dt * 4;
        st.y += st.vy * dt * 3 + Math.sin(st.phase) * 0.06;
        const mx = (st.size / r.width) * 50;
        const my = (st.size / r.height) * 50;
        if (st.x < mx + 2){ st.x = mx + 2; st.vx = Math.abs(st.vx); }
        if (st.x > 100 - mx - 2){ st.x = 100 - mx - 2; st.vx = -Math.abs(st.vx); }
        if (st.y < my + 2){ st.y = my + 2; st.vy = Math.abs(st.vy); }
        if (st.y > 100 - my - 2){ st.y = 100 - my - 2; st.vy = -Math.abs(st.vy); }
      });
      /* 簡易分離:不重疊遮蔽 */
      for (let i = 0; i < App.bubbles.length; i++){
        const a = App.bubbles[i];
        if (a.dead) continue;
        for (let j = i + 1; j < App.bubbles.length; j++){
          const b2 = App.bubbles[j];
          if (b2.dead) continue;
          const dx = b2.x - a.x, dy = (b2.y - a.y) * (r.width / Math.max(1, r.height));
          const dist = Math.hypot(dx, dy);
          const minD = ((a.size + b2.size) / r.width) * 52;
          if (dist < minD && dist > 0.01){
            const push = (minD - dist) / 2;
            const nx = dx / dist, ny = dy / dist;
            a.x -= nx * push * 0.5; b2.x += nx * push * 0.5;
            a.y -= ny * push * 0.4; b2.y += ny * push * 0.4;
            const tvx = a.vx; a.vx = b2.vx; b2.vx = tvx;
          }
        }
      }
      App.bubbles.forEach(st => {
        if (st.dead) return;
        const px = (st.x / 100) * r.width - st.size / 2;
        const py = (st.y / 100) * r.height - st.size / 2;
        st.el.style.transform = 'translate(' + px + 'px,' + py + 'px)';
      });
    }
    App.bubbleRAF = requestAnimationFrame(step);
  };
  App.bubbleRAF = requestAnimationFrame(step);
}
function stopBubbles(){
  if (App.bubbleRAF){ cancelAnimationFrame(App.bubbleRAF); App.bubbleRAF = null; }
  App.bubbles = [];
}

/* ============ MODE 5: 數量配對 ============ */
function renderMatch(q){
  const area = $('#question-area');
  $('#answer-area').innerHTML = '';
  area.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'match-wrap';
  const items = document.createElement('div');
  items.className = 'match-items';
  items.id = 'match-items';
  const perRow = q.num <= 4 ? 2 : q.num <= 9 ? 3 : 4;
  items.style.maxWidth = 'min(52vw,' + (perRow * 84 + 40) + 'px)';
  for (let i = 0; i < q.num; i++){
    const d = document.createElement('div');
    d.className = 'mi';
    d.style.transitionDelay = (i * 70) + 'ms';
    d.innerHTML = itemSVG(q.item.id);
    items.appendChild(d);
  }
  const nums = document.createElement('div');
  nums.className = 'match-nums';
  q.options.forEach(n => {
    const b = document.createElement('button');
    b.className = 'match-num';
    b.dataset.num = n;
    b.setAttribute('aria-label', txt('數字 ' + numToZh(n), 'number ' + numToEn(n)));
    b.innerHTML = numHTML(n);
    nums.appendChild(b);
    const check = () => {
      if (App.inputLocked) return;
      if (n === q.num){
        items.classList.add('done', 'anim-' + q.item.matchAnim);
        b.classList.add('correct-flash');
        SFX.pop();
        onCorrect(b);
      } else {
        onWrong(b);
      }
    };
    b._activate = check;
    makeDraggable(b, {
      isOver: (x, y) => {
        const r = items.getBoundingClientRect();
        return x > r.left && x < r.right && y > r.top && y < r.bottom;
      },
      onDrop: () => check(),
      onTap: () => check()
    });
  });
  wrap.appendChild(items);
  wrap.appendChild(nums);
  area.appendChild(wrap);
  /* 提示:讓孩子知道可以點或拖 */
  const hint = document.createElement('div');
  hint.style.cssText = 'position:absolute;bottom:2px;font-size:15px;font-weight:700;color:#8a7663;background:rgba(255,255,255,.7);border-radius:999px;padding:3px 14px;';
  hint.textContent = txt('點一點,或把數字拖過去!', 'Tap, or drag the number over!');
  area.appendChild(hint);
}
MODE_RENDER.feed = renderFeed;
MODE_RENDER.bubble = renderBubble;
MODE_RENDER.match = renderMatch;
</script>

<script>
'use strict';
/* ============ REWARDS: 過關與獎勵 ============ */
function awardSticker(){
  const p = Save.data.progress;
  const next = stickers.find(s => p.unlockedStickers.indexOf(s.id) < 0);
  if (!next) return null;
  p.unlockedStickers.push(next.id);
  if (Save.data.newStickers.indexOf(next.id) < 0) Save.data.newStickers.push(next.id);
  return next;
}
function awardAccessory(){
  const p = Save.data.progress;
  const next = accessories.find(a => p.unlockedAccessories.indexOf(a.id) < 0);
  if (!next) return null;
  p.unlockedAccessories.push(next.id);
  return next;
}
function awardIslandUpgrade(){
  const p = Save.data.progress;
  const next = islandUpgrades.find(u => p.islandUpgrades.indexOf(u.id) < 0);
  if (!next) return null;
  p.islandUpgrades.push(next.id);
  if (Save.data.newUpgrades.indexOf(next.id) < 0) Save.data.newUpgrades.push(next.id);
  return next;
}
function finishLevel(){
  stopBubbles();
  Speech.cancel();
  const p = Save.data.progress;
  p.levelsCompleted++;
  p.areaLevels[App.areaId] = (p.areaLevels[App.areaId] || 0) + 1;
  const idx = AREA_ORDER.indexOf(App.areaId);
  if (p.completedAreas.indexOf(App.areaId) < 0){
    p.completedAreas.push(App.areaId);
    const nextId = AREA_ORDER[idx + 1];
    if (nextId && p.unlockedAreas.indexOf(nextId) < 0) p.unlockedAreas.push(nextId);
  }
  const sticker = awardSticker();
  const isBig = p.levelsCompleted % 3 === 0;
  let acc = null, upg = null;
  if (isBig){
    acc = awardAccessory();
    upg = awardIslandUpgrade();
    if (p.chestPending.indexOf(App.areaId) < 0) p.chestPending.push(App.areaId);
  }
  Save.save();
  SFX.fanfare();
  showScreen('levelcomplete');
  renderLevelComplete(sticker, { big: isBig, acc: acc, upg: upg });
  spawnConfetti(40);
  /* 五區全部完成:大結局(只播一次) */
  const allDone = AREA_ORDER.every(id => p.completedAreas.indexOf(id) >= 0);
  if (allDone && !p.endingSeen){
    p.endingSeen = true;
    Save.save();
    setTimeout(() => { if (typeof showEnding === 'function') showEnding(); }, isBig ? 6500 : (REDUCED_MOTION ? 800 : 3000));
  }
}

/* ============ RENDER: LEVEL_COMPLETE ============ */
function renderLevelComplete(sticker, big){
  const inner = $('#lc-inner');
  const q = App.correctThisLevel, total = App.questions.length;
  let html =
    '<div class="lc-title">' + esc(txt('太棒了!過關了!', 'Yay! Level clear!')) + '</div>' +
    '<div class="lc-char" id="lc-char">' + characterSVG(currentCharId(), 'dancing', equipped()) + '</div>' +
    '<div class="lc-stars">';
  for (let i = 0; i < App.starsThisLevel; i++) html += '<div class="lc-star" data-i="' + i + '">' + ICONS.star + '</div>';
  html += '</div>' +
    '<div class="lc-info">' + esc(txt('答對了 ' + q + ' 題,得到 ' + App.starsThisLevel + ' 顆星星!', q + ' correct, ' + App.starsThisLevel + ' stars!')) + '</div>';
  if (!big.big){
    const left = 3 - (Save.data.progress.levelsCompleted % 3);
    html += '<div class="lc-info" style="background:#ffe9b8;">' +
      esc(txt('再過 ' + left + ' 關就有大寶箱喔!', left + ' more level' + (left > 1 ? 's' : '') + ' to the big chest!')) + '</div>';
  }
  if (sticker){
    html += '<div class="lc-reward"><div class="rw-icon">' + stickerSVG(sticker) + '</div>' +
      '<div><div class="rw-name">' + esc(stickerName(sticker)) + '</div><div class="rw-tag">' + esc(txt('新貼紙!', 'New sticker!')) + '</div></div></div>';
  }
  if (big.big){
    html += '<div class="chest-box" id="lc-chest">' + chestSVG(false) + '<div class="chest-glow"></div></div>' +
      '<div style="font-weight:800;color:#8a5a2a;">' + esc(txt('大寶箱出現了!', 'A big treasure chest appeared!')) + '</div>';
  }
  html += '<div class="lc-btns">' +
    '<button class="big-btn blue" id="btn-lc-map">' + esc(txt('回到小島', 'Back to island')) + '</button>' +
    '<button class="big-btn green" id="btn-lc-next">' + esc(txt('繼續冒險', 'Keep going')) + '</button></div>';
  inner.innerHTML = html;
  /* 星星逐顆跳出 */
  $$('.lc-star', inner).forEach((s, i) => {
    setTimeout(() => { s.classList.add('show'); SFX.star(); }, REDUCED_MOTION ? 0 : 350 + i * 260);
  });
  if (big.big){
    setTimeout(() => {
      const c = $('#lc-chest');
      if (c){ c.classList.add('open'); SFX.chest(); }
    }, REDUCED_MOTION ? 100 : 1200);
    setTimeout(() => { if (App.screen === 'levelcomplete') openBigChest(App.areaId); }, REDUCED_MOTION ? 600 : 2400);
  }
  const say = txt('太棒了!我們過關了!', 'Hooray! We did it!');
  Speech.speak(say);
  $('#btn-lc-map').addEventListener('click', () => { SFX.click(); showScreen('map'); });
  $('#btn-lc-next').addEventListener('click', () => {
    SFX.click();
    const p = Save.data.progress;
    const nextArea = AREA_ORDER.find(id => p.unlockedAreas.indexOf(id) >= 0 && p.completedAreas.indexOf(id) < 0);
    startLevel(nextArea || App.areaId);
  });
}
function chestSVG(open){
  return '<svg viewBox="0 0 160 130" style="width:100%;">' +
    '<rect x="20" y="56" width="120" height="62" rx="12" fill="#a0632f"/>' +
    '<rect x="20" y="56" width="120" height="12" fill="#8a5225"/>' +
    '<g class="chest-lid"><path d="M20 60 Q20 18 80 18 Q140 18 140 60 Z" fill="#c07f3e"/><path d="M20 60 L140 60 L140 52 L20 52 Z" fill="#8a5225"/></g>' +
    '<rect x="72" y="52" width="16" height="20" rx="4" fill="#ffd23f"/>' +

/* ============ 大寶箱 ============ */
function openBigChest(areaId){
  const p = Save.data.progress;
  const ov = $('#chest-overlay');
  ov.classList.add('show');
  $('#btn-chest-ok').hidden = true;
  $('#chest-hint').textContent = txt('點一下寶箱打開它!', 'Tap the chest to open it!');
  $('#chest-rewards').innerHTML = '';
  const box = $('#chest-box');
  box.classList.remove('open');
  box.innerHTML = chestSVG(false) + '<div class="chest-glow"></div>';
  box.style.pointerEvents = 'auto';
  const open = () => {
    box.style.pointerEvents = 'none';
    box.classList.add('open');
    SFX.chest();
    spawnConfetti(30);
    Speech.speak(txt('哇!寶箱打開了!', 'Wow! The chest opened!'));
    $('#chest-hint').textContent = txt('得到好多寶物!', 'So many treasures!');
    /* 展示本次大寶箱內容:最近解鎖的配件/升級/貼紙 */
    const cards = [];
    const lastAcc = accessories.filter(a => p.unlockedAccessories.indexOf(a.id) >= 0).slice(-1)[0];
    const lastUpg = islandUpgrades.filter(u => p.islandUpgrades.indexOf(u.id) >= 0).slice(-1)[0];
    const lastStk = stickers.filter(s => p.unlockedStickers.indexOf(s.id) >= 0).slice(-1)[0];
    if (lastAcc) cards.push({ icon: ACCESSORY_ICONS[lastAcc.id], name: accName(lastAcc), type: txt('新配件', 'Accessory') });
    if (lastUpg) cards.push({ icon: lastUpg.icon, name: upgName(lastUpg), type: txt('小島新建設', 'Island upgrade') });
    if (lastStk) cards.push({ icon: stickerSVG(lastStk), name: stickerName(lastStk), type: txt('貼紙', 'Sticker') });
    if (cards.length === 0) cards.push({ icon: ICONS.star, name: txt('星星', 'Stars'), type: '+5' });
    const rw = $('#chest-rewards');
    rw.innerHTML = cards.map(c =>
      '<div class="chest-reward-card"><div class="cr-icon">' + c.icon + '</div>' +
      '<div class="cr-name">' + esc(c.name) + '</div><div class="cr-type">' + esc(c.type) + '</div></div>').join('');
    $$('.chest-reward-card', rw).forEach((c, i) => {
      setTimeout(() => { c.classList.add('show'); SFX.star(); }, 300 + i * 350);
    });
    /* 開過就從待開清單移除 */
    const idx = p.chestPending.indexOf(areaId);
    if (idx >= 0) p.chestPending.splice(idx, 1);
    Save.save();
    setTimeout(() => { $('#btn-chest-ok').hidden = false; }, 300 + cards.length * 350 + 300);
  };
  box.onclick = open;
}
function accName(a){ return Save.data.settings.languageMode === 'en' ? a.nameEn : a.nameZh; }
function upgName(u){ return Save.data.settings.languageMode === 'en' ? u.nameEn : u.nameZh; }

/* ============ RENDER: COLLECTION 收集冊 ============ */
function renderCollection(){
  const tabs = $('#col-tabs');
  tabs.innerHTML = '';
  STICKER_CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'col-tab' + (App.colTab === c.id ? ' active' : '');
    b.textContent = Save.data.settings.languageMode === 'en' ? c.nameEn : c.nameZh;
    b.addEventListener('click', () => { SFX.click(); App.colTab = c.id; renderCollection(); });
    tabs.appendChild(b);
  });
  const grid = $('#sticker-grid');
  grid.innerHTML = '';
  const p = Save.data.progress;
  stickers.filter(s => s.cat === App.colTab).forEach(s => {
    const owned = p.unlockedStickers.indexOf(s.id) >= 0;
    const isNew = Save.data.newStickers.indexOf(s.id) >= 0;
    const cell = document.createElement('div');
    cell.className = 'sticker-cell' + (owned ? '' : ' silhouette') + (isNew ? ' new-reveal' : '');
    cell.innerHTML = '<div class="st-icon">' + stickerSVG(s) + '</div>' +
      '<div class="st-name">' + (owned ? esc(stickerName(s)) : '？') + '</div>';
    grid.appendChild(cell);
  });
  /* 看過就清除新貼紙標記 */
  Save.data.newStickers = Save.data.newStickers.filter(id => {
    const s = stickers.find(x => x.id === id);
    return s && s.cat !== App.colTab;
  });
  Save.save();
  const ownedCount = Save.data.progress.unlockedStickers.length;
  $('.screen-sub', $('#screen-collection')) && $('.screen-sub', $('#screen-collection')).remove();
  let sub = $('#screen-collection .screen-sub');
  if (!sub){
    sub = document.createElement('div');
    sub.className = 'screen-sub';
    $('#screen-collection .screen-title').after(sub);
  }
  sub.textContent = txt('已收集 ' + ownedCount + ' / ' + stickers.length, ownedCount + ' / ' + stickers.length + ' collected');
}

/* ============ RENDER: DRESS_UP 換裝 ============ */
function renderDressUp(){
  $('#du-char').innerHTML = characterSVG(currentCharId(), 'idle', equipped());
  const panel = $('#du-panel');
  panel.innerHTML = '';
  const p = Save.data.progress;
  ACC_SLOTS.forEach(slot => {
    const row = document.createElement('div');
    row.className = 'du-slot-row';
    const label = document.createElement('div');
    label.className = 'du-slot-label';
    label.textContent = Save.data.settings.languageMode === 'en' ? slot.nameEn : slot.nameZh;
    row.appendChild(label);
    accessories.filter(a => a.slot === slot.id).forEach(a => {
      const owned = p.unlockedAccessories.indexOf(a.id) >= 0;
      const isOn = equipped()[slot.id] === a.id;
      const b = document.createElement('button');
      b.className = 'du-acc' + (owned ? '' : ' locked') + (isOn ? ' equipped' : '');
      b.setAttribute('aria-label', accName(a) + (owned ? '' : txt('(未解鎖)', '(locked)')));
      b.innerHTML = ACCESSORY_ICONS[a.id];
      b.addEventListener('click', () => {
        if (!owned){
          SFX.boing();
          toast(txt('繼續冒險來解鎖它!', 'Keep adventuring to unlock it!'));
          return;
        }
        SFX.click();
        if (equipped()[slot.id] === a.id) delete equipped()[slot.id];
        else equipped()[slot.id] = a.id;
        Save.save();
        renderDressUp();
        setCharState($('#du-char'), 'happy');
      });
      row.appendChild(b);
    });
    panel.appendChild(row);
  });
}

<script>
'use strict';
/* ============ PARENT CENTER: 家長中心 ============ */
function renderParentCenter(){
