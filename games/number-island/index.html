      '<button class="opt-chip" id="pc-rate-test">試聽</button></div></div>' +
    '<div class="parent-card"><h3>聲音與提示</h3><div class="opt-row">' +
      '<button class="opt-chip green' + (s.musicEnabled ? ' on' : '') + '" id="pc-music">背景音樂 ' + (s.musicEnabled ? '開' : '關') + '</button>' +
      '<button class="opt-chip green' + (s.soundEnabled ? ' on' : '') + '" id="pc-sound">音效 ' + (s.soundEnabled ? '開' : '關') + '</button>' +
      '<button class="opt-chip green' + (s.hintsEnabled ? ' on' : '') + '" id="pc-hints">答錯提示 ' + (s.hintsEnabled ? '開' : '關') + '</button>' +
    '</div></div>' +
    '<div class="parent-card"><h3>語言模式</h3><div class="opt-row" id="pc-lang">' +
      pcChip('zh-TW', '繁體中文', s.languageMode) + pcChip('en', 'English', s.languageMode) + pcChip('both', '中英雙語', s.languageMode) +
    '</div></div>' +
    '<div class="parent-card"><h3>學習統計</h3><div id="pc-stats"></div></div>' +
    '<div class="parent-card"><h3>進度管理</h3>' +
      '<div style="font-size:15px;color:#8a7663;margin-bottom:8px;">累積星星 ' + Save.data.progress.stars + ' 顆 · 完成關卡 ' + Save.data.progress.levelsCompleted + ' 次</div>' +
      '<button class="danger-btn" id="pc-clear">清除全部進度</button>' +
      '<div id="pc-clear-confirm" style="margin-top:10px;"></div></div>';
  panel.innerHTML = html;
  /* 數字範圍 */
  $$('#pc-range .opt-chip').forEach(b => b.addEventListener('click', () => {

    s.numberRange.max = Number(parts[1]);

  }));
  $$('#pc-qcount .opt-chip').forEach(b => b.addEventListener('click', () => {

  $$('#pc-lang .opt-chip').forEach(b => b.addEventListener('click', () => {
    s.languageMode = b.dataset.v;
    Save.save(); renderParentCenter();

  $('#pc-rate').addEventListener('input', e => {
    s.voiceRate = Number(e.target.value);

    unlockAudio();
    Speech.speak(s.languageMode === 'en' ? 'One, two, three! Great job!' : '一、二、三,你好棒!');
  });
  $('#pc-music').addEventListener('click', () => {
    s.musicEnabled = !s.musicEnabled;
    Save.save(); unlockAudio(); AudioSys.applyToggles();
    if (s.musicEnabled) BGM.start(); else BGM.stop();

      '<button class="opt-chip" id="pc-clear-no">取消</button>';
    $('#pc-clear-yes').addEventListener('click', () => {
      Save.clear();
      toast('進度已清除');
      renderParentCenter();
    });
    $('#pc-clear-no').addEventListener('click', () => { $('#pc-clear-confirm').innerHTML = ''; });
  });
  $('#btn-parent-back').addEventListener('click', () => { SFX.click(); showScreen('home'); });

function pcChip(v, label, current){
  return '<button class="opt-chip' + (String(v) === String(current) ? ' on' : '') + '" data-v="' + esc(v) + '">' + esc(label) + '</button>';
}
/* 逐數字答題統計 */
function renderParentStats(){
  const box = $('#pc-stats');
  const st = Save.data.numberStats;
  const r = Save.data.settings.numberRange;
  let rows = '';
  const missed = [];
  for (let n = r.min; n <= r.max; n++){
    const s = numStat(n);
    const acc = s.appear ? Math.round((s.correct / s.appear) * 100) : null;
    const ft = s.correct ? Math.round((s.firstTry / s.correct) * 100) : null;
    const avg = s.appear ? (s.totalMs / s.appear / 1000).toFixed(1) : null;
    if (s.appear >= 2 && s.wrong > s.correct) missed.push({ n: n, wrong: s.wrong });
    rows += '<tr><td style="font-weight:900;">' + n + '</td><td>' + s.appear + '</td><td>' + s.correct + '</td><td>' + s.wrong + '</td>' +
      '<td>' + (acc === null ? '—' : acc + '%') + '</td><td>' + (ft === null ? '—' : ft + '%') + '</td><td>' + (avg === null ? '—' : avg + 's') + '</td></tr>';
  }
  missed.sort((a, b) => b.wrong - a.wrong);
  const missedTxt = missed.length ? missed.slice(0, 5).map(m => m.n).join('、') : '目前沒有明顯弱項';
  box.innerHTML =
    '<div style="margin-bottom:8px;font-size:15px;">總遊玩次數:<b>' + Save.data.totalSessions + '</b> · 總答題數:<b>' + Save.data.totalAnswers + '</b></div>' +
    '<div style="margin-bottom:8px;font-size:15px;">最常答錯的數字:<b>' + esc(missedTxt) + '</b></div>' +
    '<div class="stats-scroll"><table class="stats-table"><thead><tr>' +
    '<th>數字</th><th>出現</th><th>答對</th><th>答錯</th><th>正確率</th><th>一次答對</th><th>平均秒數</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    (typeof accuracyChartSVG === 'function' ? accuracyChartSVG(r) : '');
}

/* ============ 家長入口:長按 3 秒或答對成人題 ============ */
function setupParentGate(){
  const btn = $('#btn-parent-entry');
  let holdTimer = null, held = false;
  const startHold = (e) => {
    e.preventDefault();
    held = false;
    btn.classList.add('holding');
    holdTimer = setTimeout(() => {
      held = true;
      btn.classList.remove('holding');
      unlockAudio();
      showScreen('parent');
      Renderers.parent = renderParentCenter;
    }, 3000);
  };
  const cancelHold = () => {
    clearTimeout(holdTimer);
    btn.classList.remove('holding');
    if (!held){ showAdultQuestion(); }
  };
  btn.addEventListener('pointerdown', startHold);
  btn.addEventListener('pointerup', cancelHold);
  btn.addEventListener('pointerleave', () => { clearTimeout(holdTimer); btn.classList.remove('holding'); });
  btn.addEventListener('pointercancel', () => { clearTimeout(holdTimer); btn.classList.remove('holding'); });
  $('#btn-adult-cancel').addEventListener('click', () => $('#adult-gate').classList.remove('show'));
}
function showAdultQuestion(){
  const gate = $('#adult-gate');
  const a = randInt(4, 9), b = randInt(3, 9);
  const ans = a + b;
  $('#adult-q').textContent = a + ' + ' + b + ' = ?';
  const opts = new Set([ans]);
  while (opts.size < 4) opts.add(ans + choice([-3, -2, -1, 1, 2, 3]));
  const box = $('#adult-opts');
  box.innerHTML = '';
  shuffle(Array.from(opts)).forEach(v => {
    const c = document.createElement('button');
    c.className = 'opt-chip';
    c.textContent = v;
    c.addEventListener('click', () => {
      if (v === ans){
        gate.classList.remove('show');
        showScreen('parent');
      } else {
        toast('再試一次');
        showAdultQuestion();
      }
    });
    box.appendChild(c);
  });
  gate.classList.add('show');
}

/* ============ 暫停 ============ */
function pauseGame(){
  if (App.screen !== 'playing') return;
  Speech.cancel();
  App.inputLocked = true;
  $('#pause-char').innerHTML = characterSVG(currentCharId(), 'idle', equipped());
  $('#pause-overlay').classList.add('show');
}
function resumeGame(){
  $('#pause-overlay').classList.remove('show');
  App.inputLocked = false;
  if (App.currentQ) Speech.speak(questionSpeechText(App.currentQ));
}

/* ============ INIT: 事件綁定與啟動 ============ */
function init(){
  Save.load();
  Save.data.totalSessions++;
  Save.save();
  Speech.init();
  setupParentGate();
  /* 全域第一指觸:解鎖音訊 */
  window.addEventListener('pointerdown', function once(){
    unlockAudio();
    window.removeEventListener('pointerdown', once);
  }, { passive: true });
  /* 首頁 */
  $('#btn-start').addEventListener('click', () => {
    unlockAudio();
    SFX.click();
    if (Save.data.progress.selectedCharacter) showScreen('map');
    else showScreen('character');
    const c = charById(currentCharId());
    Speech.speak(speakPhrase({ zh: '出發囉!和' + c.nameZh + '一起找數字星星!', en: 'Let us go find the number stars with ' + c.nameEn + '!' }));
  });
  $('#btn-sound-home').addEventListener('click', () => {
    unlockAudio();
    const s = Save.data.settings;
    const anyOn = s.soundEnabled || s.musicEnabled;
    s.soundEnabled = !anyOn;
    s.musicEnabled = !anyOn;
    Save.save();
    AudioSys.applyToggles();
    if (s.musicEnabled) BGM.start(); else BGM.stop();
    updateSoundIcon();
    SFX.click();
  });
  /* 角色選擇 */
  $('#btn-char-back').addEventListener('click', () => { SFX.click(); showScreen('home'); });
  $('#btn-char-ok').addEventListener('click', () => {
    if (!App.selectedCharTmp) return;
    unlockAudio(); SFX.correct();
    Save.data.progress.selectedCharacter = App.selectedCharTmp;
    Save.save();
    showScreen('map');
    const c = charById(App.selectedCharTmp);
    Speech.speak(speakPhrase({ zh: c.nameZh + '出發!先從蘋果森林開始吧!', en: c.nameEn + ' is ready! Let us start at Apple Forest!' }));
  });
  /* 地圖 */
  $('#btn-map-home').innerHTML = ICONS.home;
  $('#btn-map-home').addEventListener('click', () => { SFX.click(); showScreen('home'); });
  $('#icon-album').innerHTML = ICONS.album;
  $('#icon-dress').innerHTML = ICONS.dress;
  $('#icon-island').innerHTML = ICONS.island;
  $('#btn-map-collection').addEventListener('click', () => { SFX.click(); showScreen('collection'); });
  $('#btn-map-dressup').addEventListener('click', () => { SFX.click(); showScreen('dressup'); });
  $('#btn-map-island').addEventListener('click', () => { SFX.click(); showScreen('island'); });
  /* 答題畫面 */
  $('#btn-play-back').addEventListener('click', () => {
    SFX.click();
    Speech.cancel();
    showScreen('map');
  });
  $('#btn-replay').addEventListener('pointerdown', () => { unlockAudio(); });
  $('#btn-replay').addEventListener('click', replayQuestion);
  $('#btn-pause').addEventListener('click', () => { SFX.click(); pauseGame(); });
  $('#btn-resume').addEventListener('click', () => { SFX.click(); resumeGame(); });
  $('#btn-pause-map').addEventListener('click', () => {
    SFX.click();
    $('#pause-overlay').classList.remove('show');
    App.inputLocked = false;
    showScreen('map');
  });
  /* 各畫面返回 */
  $('#btn-col-back').addEventListener('click', () => { SFX.click(); showScreen('map'); });
  $('#btn-du-back').addEventListener('click', () => { SFX.click(); showScreen('map'); });
  $('#btn-island-back').addEventListener('click', () => { SFX.click(); showScreen('map'); });
  $('#btn-chest-ok').addEventListener('click', () => {
    SFX.click();
    $('#chest-overlay').classList.remove('show');
    if (App.screen === 'levelcomplete' || App.screen === 'map') showScreen('map');
  });
  /* 鍵盤操作:1-4 選答案,Esc 暫停 */
  document.addEventListener('keydown', (e) => {
    if (App.screen === 'playing' && !$('#pause-overlay').classList.contains('show')){
      if (e.key >= '1' && e.key <= '4'){
        const idx = Number(e.key) - 1;
        const btns = $$('#answer-area .answer-btn');
        const matchBtns = $$('#question-area .match-num');
        const bubbles = $$('#question-area .bubble');
        const pool = btns.length ? btns : (matchBtns.length ? matchBtns : bubbles);
        const target = pool[idx];
        if (target){
          if (target._activate) target._activate();
          else target.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
        }
      } else if (e.key === 'Escape'){
        pauseGame();
      } else if (e.key === 'r' || e.key === 'R'){
        replayQuestion();
      }
    } else if (e.key === 'Escape' && App.screen === 'playing'){
      resumeGame();
    }
  });
  /* 防止長按叫出選單 / iOS 雙擊縮放 */
  $('#app').addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  /* 分頁切走:停止語音 */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) Speech.cancel();
  });
  /* 註冊渲染器 */
  Renderers.home = renderHome;
  Renderers.character = renderCharacterSelect;
  Renderers.map = renderMap;
  Renderers.levelcomplete = function(){};   // 由 finishLevel 直接渲染
  Renderers.collection = renderCollection;
  Renderers.dressup = renderDressUp;
  Renderers.island = renderIsland;
  Renderers.parent = renderParentCenter;
  /* 啟動 */
  showScreen('home');
}
document.addEventListener('DOMContentLoaded', init);
</script>

function maybeTutorial(q){
  const seen = Save.data.tutorialSeen || (Save.data.tutorialSeen = {});
  if (seen[q.mode]) return;
  const sel = {
    listen: '#answer-area .answer-btn',
    count: '#answer-area .answer-btn',
    feed: '.feed-tray .drag-item',
    bubble: '#question-area .bubble',
    match: '#question-area .match-num'
  }[q.mode];
  const target = sel ? $(sel) : null;
  if (!target) return;
  const r = target.getBoundingClientRect();
  if (r.width === 0) return;
  const hand = document.createElement('div');
  hand.className = 'tutorial-hand';
  const labelKey = q.mode === 'feed' ? { zh: '拖過去餵牠!', en: 'Drag it over!' } :

  hand.innerHTML = TUT_ARROW + '<span>' + esc(txt(labelKey.zh, labelKey.en)) + '</span>';

  hand.style.top = Math.max(6, r.top - 96) + 'px';

    '<div class="ab-icon">' + AREA_ICONS[area.id] + '</div>' +
    '<div class="ab-name" style="color:' + area.color + ';">' + esc(Save.data.settings.languageMode === 'en' ? area.nameEn : area.nameZh) + '</div>' +
    '<div class="ab-sub">' + esc(txt(area.introZh, area.introEn)) + '</div>';
  document.body.appendChild(banner);
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    banner.classList.add('out');
    setTimeout(() => banner.remove(), 320);
    cb();
  };
  Speech.speak(speakPhrase({ zh: area.nameZh + '! ' + area.introZh, en: area.nameEn + '! ' + area.introEn }), { onend: () => setTimeout(finish, 500) });
  setTimeout(finish, REDUCED_MOTION ? 1200 : 3600);   /* 保險計時 */
}
/* 五區全破大結局 */
function showEnding(){
  Speech.cancel();
  const ov = document.createElement('div');
  ov.className = 'ending-overlay';
  const chars = characters.map(c =>
    '<div>' + characterSVG(c.id, 'dancing', c.id === currentCharId() ? equipped() : {}) + '</div>').join('');
  ov.innerHTML =
    '<div class="ending-card">' +
      '<div class="lc-title">' + esc(txt('所有數字星星都找回來了!', 'All the number stars are back!')) + '</div>' +
      '<div class="ending-chars">' + chars + '</div>' +
      '<div class="lc-info">' + esc(txt('謝謝你,小小冒險家!數字島永遠歡迎你!', 'Thank you, little adventurer! Number Island always welcomes you!')) + '</div>' +
      '<button class="big-btn green" id="btn-ending-ok">' + esc(txt('繼續玩', 'Keep playing')) + '</button>' +
    '</div>';
  document.body.appendChild(ov);
  spawnConfetti(70);
  SFX.fanfare();
  Speech.speak(txt('太棒了!你把所有數字星星都找回來了!謝謝你!', 'Amazing! You found every number star! Thank you!'));
  $('#btn-ending-ok').addEventListener('click', () => { SFX.click(); ov.remove(); });
}
/* 家長中心:逐數字正確率長條圖 */
function accuracyChartSVG(range){
  const bars = [];
  const data = [];
  for (let n = range.min; n <= range.max; n++){
    const s = numStat(n);
    const acc = s.appear ? s.correct / s.appear : null;
    data.push({ n: n, acc: acc, appear: s.appear });
  }
  const W = 640, H = 170, padL = 30, padB = 30, padT = 14;
  const bw = (W - padL - 10) / data.length;
  data.forEach((d, i) => {
    const x = padL + i * bw + bw * 0.18;
    const w = bw * 0.64;
    if (d.acc === null){
      bars.push('<rect x="' + x.toFixed(1) + '" y="' + (H - padB - 4) + '" width="' + w.toFixed(1) + '" height="4" rx="2" fill="#e6ddcf"/>');
    } else {
      const h = Math.max(4, (H - padT - padB) * d.acc);
      const color = d.acc >= 0.8 ? '#8bd450' : d.acc >= 0.5 ? '#ffd23f' : '#ff9e80';
      bars.push('<rect x="' + x.toFixed(1) + '" y="' + (H - padB - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" fill="' + color + '"/>');
      bars.push('<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - padB - h - 4).toFixed(1) + '" font-size="11" text-anchor="middle" fill="#8a7663">' + Math.round(d.acc * 100) + '</text>');
    }
    bars.push('<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - padB + 16) + '" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a3b31">' + d.n + '</text>');
  });
  return '<div style="margin-top:10px;"><div style="font-weight:900;font-size:15px;margin-bottom:4px;">逐數字正確率(%)</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;background:#fbf6ec;border-radius:12px;">' +
    '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - 8) + '" y2="' + (H - padB) + '" stroke="#d9cdb8" stroke-width="2"/>' +
    bars.join('') + '</svg></div>';
}
</script>
