function resumeGame(){
  // if a question finished while paused, advance now
  G.paused = false;
  if(G.pendingNext){
    G.pendingNext = false;
    G.qIndex++;
    nextQuestion();
    return true;
  }
  return false;
}
function openPause(){
  Speech.stop();
  G.paused = true; // parks the answer pipeline — nothing advances behind the modal
  const m = openModal(
    '<h2>休息一下</h2>' +
    '<div class="mrow" style="flex-direction:column;align-items:center">' +
    '<button class="bb green" id="pz-go" style="min-width:220px">▶️ 繼續玩</button>' +
    '<button class="bb ghost" id="pz-replay" style="min-width:220px">🔊 再聽一次</button>' +
    '<button class="bb ghost" id="pz-map" style="min-width:220px">🏝️ 回到地圖</button>' +
    '</div>'
  );
  m.box.querySelector('#pz-go').onclick = () => { AudioSys.sfx('click'); closeModal(m.ov); resumeGame(); };
  m.box.querySelector('#pz-replay').onclick = () => {
    AudioSys.sfx('click'); closeModal(m.ov);
    if(!resumeGame()) speakPrompt(); // nextQuestion already speaks its own prompt
  };
  m.box.querySelector('#pz-map').onclick = () => {
    AudioSys.sfx('click'); G.paused = false; G.pendingNext = false;
    closeModal(m.ov); showScreen('scr-map');
  };
}
function confirmExitGame(){
  G.paused = true;
  const m = openModal(
    '<h2>要回到地圖嗎？</h2><p style="font-weight:700;color:#7a6a55">這一關可以下次再玩喔！</p>' +
    '<div class="mrow"><button class="bb green" id="ex-no">繼續玩</button><button class="bb ghost" id="ex-yes">回地圖</button></div>'
  );
  m.box.querySelector('#ex-no').onclick = () => { AudioSys.sfx('click'); closeModal(m.ov); resumeGame(); };
  m.box.querySelector('#ex-yes').onclick = () => {
    AudioSys.sfx('click'); G.paused = false; G.pendingNext = false;
    closeModal(m.ov); showScreen('scr-map');
  };
}
// ==============================
// INIT & GLOBAL BINDINGS
// ==============================
function bindUI(){
  // home
  $('#btn-start').onclick = () => {
    AudioSys.ensure();
    warmupSpeech();
    AudioSys.sfx('click');
    const go = () => {
      if(!P.selectedCharacter){ renderCharSelect(); showScreen('scr-char'); }
      else showScreen('scr-map');
    };
    if(!P.ageAsked) openAgeModal(go);
    else go();
  };
  $('#btn-home-sound').onclick = () => { AudioSys.ensure(); toggleSound(); };
  $('#btn-home-parent').onclick = () => { AudioSys.ensure(); AudioSys.sfx('click'); openParentGate('scr-home'); };
  // character select
  $('#btn-char-back').innerHTML = UI_ICO.back;
  $('#btn-char-back').onclick = () => { AudioSys.sfx('click'); showScreen(P.selectedCharacter ? 'scr-map' : 'scr-home'); };
  $('#btn-char-ok').onclick = () => {
    if(!charPick){
      // guide, don't dead-end: the big button talks back when nothing is picked yet
      AudioSys.sfx('wrong');
      Speech.sayPair({ zh:'先點一位好朋友吧！', en:'Pick a friend first!' });
      const g = $('#char-grid');
      g.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}], {duration:320});
      return;
    }
    P.selectedCharacter = charPick;
    save();
    AudioSys.sfx('unlock');
    const c = CHAR[charPick];
    Speech.sayPair({ zh:'耶！' + c.nameZh + '和你一起去冒險！', en:'Yay! ' + c.nameEn + ' will join your adventure!' });
    showScreen('scr-map');
  };
  // map
  $('#btn-map-home').onclick = () => { AudioSys.sfx('click'); showScreen('scr-home'); };
  $('#btn-map-sound').onclick = () => toggleSound();
  $('#btn-collection').onclick = () => { AudioSys.sfx('click'); showScreen('scr-collection'); };
  $('#btn-dress').onclick = () => { AudioSys.sfx('click'); showScreen('scr-dress'); };
  $('#btn-island').onclick = () => { AudioSys.sfx('click'); showScreen('scr-island'); };
  $('#btn-parent2').onclick = () => { AudioSys.sfx('click'); openParentGate('scr-map'); };
  // sub screens back
  $('#btn-col-back').onclick = () => { AudioSys.sfx('click'); showScreen('scr-map'); };
  $('#btn-dress-back').onclick = () => { AudioSys.sfx('click'); showScreen('scr-map'); };
  $('#btn-isl-back').onclick = () => { AudioSys.sfx('click'); showScreen('scr-map'); };
  $('#btn-par-back').onclick = () => { AudioSys.sfx('click'); showScreen(parentReturn === 'scr-parent' ? 'scr-home' : parentReturn); };
  // game hud
  $('#g-back').onclick = () => { AudioSys.sfx('click'); confirmExitGame(); };
  $('#g-replay').onclick = () => { AudioSys.sfx('click'); speakPrompt(); };
  $('#g-pause').onclick = () => { AudioSys.sfx('click'); openPause(); };
}

function warmupSpeech(){
  // iOS: speechSynthesis must be first triggered inside a user gesture
  try {
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    }
  } catch(e){}
}

// keyboard support: digits pick answers, Escape pauses / goes back
function bindKeyboard(){
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      if($('#modal-root').childElementCount){ return; }
      if(currentScreen === 'scr-game' && G.active) openPause();
      else if(currentScreen !== 'scr-home' && currentScreen !== 'scr-game') showScreen('scr-map');
      return;
    }
    const d = parseInt(e.key, 10);
    if(!isNaN(d) && currentScreen === 'scr-game' && G.active && !G.locked && !$('#modal-root').childElementCount){
      const btns = $$('#answer-area .ans-btn, .match-right .ans-btn, .nbub').filter(b => !b.disabled);
      // pressing 5 picks the answer "5" when it's on screen; positional fallback otherwise
      const byVal = btns.find(b => parseInt(b.dataset.v, 10) === d);
      if(byVal){ byVal.click(); return; }
      if(d >= 1 && btns[d - 1]) btns[d - 1].click();
    }
  });
}

function bindGlobal(){
  // unlock audio on the very first touch anywhere
  document.addEventListener('pointerdown', () => { AudioSys.ensure(); VoiceBank.unlock(); }, { once: true });
  // celebration is skippable: kids who got it don't need to sit through the full fanfare
  document.addEventListener('pointerdown', () => {
    if(G.celebrating && G.celebrating === G.flowToken && G.active){
      G.skipNow = true;
      Speech.stop();
    }
  }, true);
  // stop speech & keep music paused while tab is hidden
  document.addEventListener('visibilitychange', () => { if(document.hidden) Speech.stop(); });
  // iOS pinch / double-tap zoom guards
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => { if(e.target && e.target.closest && e.target.closest('.feed-item,.nbub,.citem')) e.preventDefault(); });
}

function initGame(){
  Speech.init();
  P.totals.sessions++;
  save();
  bindUI();
  bindKeyboard();
  bindGlobal();
  renderHome();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initGame);
else initGame();
</script>
