<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Memory Match English 🎴</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Comic Sans MS', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            padding-top: env(safe-area-inset-top);
        }

        /* Header */
        .header {
            text-align: center;
            padding: 10px;
            color: white;
        }

        .header h1 {
            font-size: 1.8rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        /* Stats Bar */
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
        }

        /* Theme Selector */
        .theme-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .theme-btn {
            padding: 8px 16px;
            border: 2px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .theme-btn:hover, .theme-btn.active {
            background: rgba(255,255,255,0.3);
            border-color: white;
            transform: scale(1.05);
        }

        /* Game Board */
        .game-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        /* Cards */
        .card {
            aspect-ratio: 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card-front {
            background: linear-gradient(145deg, #fff 0%, #e8e8e8 100%);
            transform: rotateY(180deg);
        }

        .card-back {
            background: linear-gradient(145deg, #FFD460 0%, #FF6B6B 100%);
            font-size: 2rem;
        }

        .card-back::after {
            content: "?";
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card-emoji {
            font-size: 2.5rem;
            line-height: 1;
        }

        .card-word {
            font-size: 0.8rem;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
            text-align: center;
            padding: 0 5px;
        }

        .card.matched .card-front {
            background: linear-gradient(145deg, #a8ff78 0%, #78ffd6 100%);
            animation: matchPulse 0.5s;
        }

        @keyframes matchPulse {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }

        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(145deg, #FFD460 0%, #FF9A3C 100%);
            color: #333;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Victory Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 90%;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #333;
        }

        .modal-content .trophy {
            font-size: 5rem;
            margin: 20px 0;
        }

        .modal-content .stats-final {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
        }

        .stars {
            font-size: 2.5rem;
            margin: 15px 0;
        }

        /* Speaker Button */
        .speaker-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100;
            transition: transform 0.2s;
        }

        .speaker-btn:active {
            transform: scale(0.9);
        }

        /* Difficulty */
        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .diff-btn {
            padding: 6px 14px;
            border: 2px solid rgba(255,255,255,0.3);
            background: transparent;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .diff-btn.active {
            background: rgba(255,255,255,0.3);
            border-color: white;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .game-board {
                gap: 6px;
                padding: 6px;
            }
            .card-emoji {
                font-size: 2rem;
            }
            .card-word {
                font-size: 0.7rem;
            }
            .stat-box {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }

        /* 6x4 grid for hard mode */
        .game-board.hard {
            grid-template-columns: repeat(6, 1fr);
            max-width: 600px;
        }

        .game-board.hard .card-emoji {
            font-size: 1.8rem;
        }

        .game-board.hard .card-word {
            font-size: 0.65rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎴 Memory Match</h1>
    </div>

    <!-- Theme Selector -->
    <div class="theme-selector">
        <button class="theme-btn active" data-theme="animals">🐾 Animals</button>
        <button class="theme-btn" data-theme="food">🍎 Food</button>
        <button class="theme-btn" data-theme="colors">🎨 Colors</button>
        <button class="theme-btn" data-theme="numbers">🔢 Numbers</button>
        <button class="theme-btn" data-theme="weather">🌤️ Weather</button>
    </div>

    <!-- Difficulty -->
    <div class="difficulty-selector">
        <button class="diff-btn active" data-pairs="6">Easy (6)</button>
        <button class="diff-btn" data-pairs="8">Medium (8)</button>
        <button class="diff-btn" data-pairs="12">Hard (12)</button>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-box">⏱️ <span id="timer">0:00</span></div>
        <div class="stat-box">👆 <span id="moves">0</span> moves</div>
        <div class="stat-box">⭐ <span id="matches">0</span>/<span id="total">6</span></div>
    </div>

    <!-- Game Board -->
    <div class="game-container">
        <div class="game-board" id="gameBoard"></div>
    </div>

    <!-- Buttons -->
    <div class="btn-container">
        <button class="btn btn-primary" onclick="startGame()">🔄 New Game</button>
        <button class="btn btn-secondary" onclick="speakLastWord()">🔊 Repeat</button>
    </div>

    <!-- Speaker Button (floating) -->
    <button class="speaker-btn" onclick="speakLastWord()">🔊</button>

    <!-- Victory Modal -->
    <div class="modal" id="victoryModal">
        <div class="modal-content">
            <h2>🎉 Great Job!</h2>
            <div class="trophy">🏆</div>
            <div class="stars" id="stars">⭐⭐⭐</div>
            <div class="stats-final">
                <p>Time: <strong id="finalTime">0:00</strong></p>
                <p>Moves: <strong id="finalMoves">0</strong></p>
            </div>
            <button class="btn btn-primary" onclick="closeModal(); startGame();">Play Again 🎮</button>
        </div>
    </div>

    <script>
        // ============ DATA ============
        const themes = {
            animals: [
                { emoji: "🐶", word: "dog" },
                { emoji: "🐱", word: "cat" },
                { emoji: "🐭", word: "mouse" },
                { emoji: "🐰", word: "rabbit" },
                { emoji: "🦊", word: "fox" },
                { emoji: "🐻", word: "bear" },
                { emoji: "🐼", word: "panda" },
                { emoji: "🐨", word: "koala" },
                { emoji: "🦁", word: "lion" },
                { emoji: "🐯", word: "tiger" },
                { emoji: "🐮", word: "cow" },
                { emoji: "🐷", word: "pig" }
            ],
            food: [
                { emoji: "🍎", word: "apple" },
                { emoji: "🍌", word: "banana" },
                { emoji: "🍇", word: "grape" },
                { emoji: "🍓", word: "strawberry" },
                { emoji: "🍕", word: "pizza" },
                { emoji: "🍔", word: "burger" },
                { emoji: "🍦", word: "ice cream" },
                { emoji: "🍩", word: "donut" },
                { emoji: "🍪", word: "cookie" },
                { emoji: "🧀", word: "cheese" },
                { emoji: "🥕", word: "carrot" },
                { emoji: "🥚", word: "egg" }
            ],
            colors: [
                { emoji: "❤️", word: "red" },
                { emoji: "🧡", word: "orange" },
                { emoji: "💛", word: "yellow" },
                { emoji: "💚", word: "green" },
                { emoji: "💙", word: "blue" },
                { emoji: "💜", word: "purple" },
                { emoji: "🖤", word: "black" },
                { emoji: "🤍", word: "white" },
                { emoji: "🩷", word: "pink" },
                { emoji: "🤎", word: "brown" },
                { emoji: "🩶", word: "gray" },
                { emoji: "💗", word: "pink" }
            ],
            numbers: [
                { emoji: "1️⃣", word: "one" },
                { emoji: "2️⃣", word: "two" },
                { emoji: "3️⃣", word: "three" },
                { emoji: "4️⃣", word: "four" },
                { emoji: "5️⃣", word: "five" },
                { emoji: "6️⃣", word: "six" },
                { emoji: "7️⃣", word: "seven" },
                { emoji: "8️⃣", word: "eight" },
                { emoji: "9️⃣", word: "nine" },
                { emoji: "🔟", word: "ten" },
                { emoji: "💯", word: "hundred" },
                { emoji: "0️⃣", word: "zero" }
            ],
            weather: [
                { emoji: "☀️", word: "sunny" },
                { emoji: "🌧️", word: "rainy" },
                { emoji: "⛈️", word: "stormy" },
                { emoji: "❄️", word: "snowy" },
                { emoji: "🌈", word: "rainbow" },
                { emoji: "☁️", word: "cloudy" },
                { emoji: "🌪️", word: "tornado" },
                { emoji: "🌊", word: "wave" },
                { emoji: "⭐", word: "star" },
                { emoji: "🌙", word: "moon" },
                { emoji: "💨", word: "windy" },
                { emoji: "🌡️", word: "hot" }
            ]
        };

        // ============ GAME STATE ============
        let currentTheme = 'animals';
        let numPairs = 6;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let isLocked = false;
        let lastWord = "";
        let gameStarted = false;

        // ============ DOM ELEMENTS ============
        const gameBoard = document.getElementById('gameBoard');
        const timerEl = document.getElementById('timer');
        const movesEl = document.getElementById('moves');
        const matchesEl = document.getElementById('matches');
        const totalEl = document.getElementById('total');
        const victoryModal = document.getElementById('victoryModal');

        // ============ SPEECH ============
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.7;
            const voices = window.speechSynthesis.getVoices();
            const voice = voices.find(v => v.name === "Samantha") || voices.find(v => v.lang.startsWith("en"));
            if (voice) utterance.voice = voice;
            window.speechSynthesis.speak(utterance);
            lastWord = text;
        }

        function speakLastWord() {
            if (lastWord) speak(lastWord);
        }

        // ============ AUDIO ============
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'match') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'victory') {
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
                    g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.15);
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
                    o.start(audioCtx.currentTime + i * 0.15);
                    o.stop(audioCtx.currentTime + i * 0.15 + 0.3);
                });
            }
        }

        // ============ TIMER ============
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timer = 0;
            timerInterval = setInterval(() => {
                timer++;
                const mins = Math.floor(timer / 60);
                const secs = timer % 60;
                timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ============ GAME LOGIC ============
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function createCards() {
            const themeData = themes[currentTheme];
            const selected = shuffle(themeData).slice(0, numPairs);

            // Create pairs
            cards = [];
            selected.forEach((item, index) => {
                cards.push({ ...item, id: index, pairId: index });
                cards.push({ ...item, id: index + numPairs, pairId: index });
            });

            cards = shuffle(cards);
        }

        function renderBoard() {
            gameBoard.innerHTML = '';
            gameBoard.className = 'game-board' + (numPairs === 12 ? ' hard' : '');

            cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.index = index;
                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <span class="card-emoji">${card.emoji}</span>
                            <span class="card-word">${card.word}</span>
                        </div>
                        <div class="card-back"></div>
                    </div>
                `;
                cardEl.addEventListener('click', () => flipCard(cardEl, index));
                gameBoard.appendChild(cardEl);
            });
        }

        function flipCard(cardEl, index) {
            if (isLocked) return;
            if (cardEl.classList.contains('flipped')) return;
            if (cardEl.classList.contains('matched')) return;
            if (flippedCards.length >= 2) return;

            // Start game on first flip
            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }

            initAudio();
            playSound('flip');

            cardEl.classList.add('flipped');
            flippedCards.push({ el: cardEl, index, card: cards[index] });

            // Speak the word
            speak(cards[index].word);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [first, second] = flippedCards;

            if (first.card.pairId === second.card.pairId) {
                // Match!
                isLocked = true;
                setTimeout(() => {
                    first.el.classList.add('matched');
                    second.el.classList.add('matched');
                    playSound('match');
                    matchedPairs++;
                    matchesEl.textContent = matchedPairs;

                    flippedCards = [];
                    isLocked = false;

                    if (matchedPairs === numPairs) {
                        setTimeout(showVictory, 500);
                    }
                }, 500);
            } else {
                // No match
                isLocked = true;
                setTimeout(() => {
                    playSound('wrong');
                    first.el.classList.remove('flipped');
                    second.el.classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                }, 1000);
            }
        }

        function showVictory() {
            stopTimer();
            playSound('victory');

            const mins = Math.floor(timer / 60);
            const secs = timer % 60;
            document.getElementById('finalTime').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            document.getElementById('finalMoves').textContent = moves;

            // Calculate stars
            const perfectMoves = numPairs; // Best case: find all pairs in order
            const ratio = perfectMoves / moves;
            let stars = "⭐";
            if (ratio > 0.7) stars = "⭐⭐⭐";
            else if (ratio > 0.4) stars = "⭐⭐";
            document.getElementById('stars').textContent = stars;

            victoryModal.classList.add('show');
            speak("Great job! You did it!");
        }

        function closeModal() {
            victoryModal.classList.remove('show');
        }

        function startGame() {
            initAudio();
            stopTimer();
            timer = 0;
            timerEl.textContent = "0:00";
            moves = 0;
            movesEl.textContent = "0";
            matchedPairs = 0;
            matchesEl.textContent = "0";
            totalEl.textContent = numPairs;
            flippedCards = [];
            isLocked = false;
            gameStarted = false;
            lastWord = "";

            createCards();
            renderBoard();
        }

        // ============ EVENT LISTENERS ============
        // Theme buttons
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTheme = btn.dataset.theme;
                startGame();
            });
        });

        // Difficulty buttons
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                numPairs = parseInt(btn.dataset.pairs);
                startGame();
            });
        });

        // Close modal on outside click
        victoryModal.addEventListener('click', (e) => {
            if (e.target === victoryModal) closeModal();
        });

        // Load voices
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Initialize
        startGame();
    </script>
</body>
</html>
